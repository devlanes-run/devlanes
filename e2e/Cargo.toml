[package]
name = "devlanes-e2e"
description = "End-to-end tests that drive the real devlanes binary against fixture projects."
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
devlanes-testing = { path = "../crates/testing" }
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

# Process table, verified termination, listeners and reserved port ranges; Unix uses
# `ps`, `lsof` and signals.
[target.'cfg(windows)'.dependencies]
devlanes-sys = { path = "../crates/sys" }
devlanes-sys-windows = { path = "../crates/sys-windows" }

[dev-dependencies]
# The remote tests open a session to a real `devlanes tunnel --stdio` themselves.
devlanes-transport = { path = "../crates/transport" }
devlanes-transport-command = { path = "../crates/transport-command" }
# The TUI tests run `devlanes ui` in a pseudo-terminal and read its screen.
portable-pty = "0.9"
# The fake daemon's named pipe, and the remote tests' sessions.
tokio.workspace = true
vt100 = "0.18"

# The tunnel command a Windows box's shell gets, quoted as the SSH transport quotes it.
[target.'cfg(windows)'.dev-dependencies]
devlanes-transport-ssh = { path = "../crates/transport-ssh" }
