version = 1

[git]
# devlanes is tagged vX.Y.Z, which starts release.yml; the other crates keep the
# default devlanes-<name>-vX.Y.Z.
short_tags = "devlanes"

[changelog]
show_acknowledgments = false

[packages]
# The workspace ships as one binary with one version, so every crate moves together.
fixed = [[
  "cargo/devlanes",
  "cargo/devlanes-cli",
  "cargo/devlanes-client",
  "cargo/devlanes-config",
  "cargo/devlanes-core",
