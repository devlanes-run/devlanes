<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 645" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>The browser on your machine opens https://myapp.localhost; your proxy passes it to your daemon's listener on 127.0.0.1:28001, which sends it over one connection to the daemon in devbox, a container on your machine's Docker, where web in myapp lane 0 answers on port 28001</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .path { stroke: var(--dl-diagram-accent, currentColor); fill: none; stroke-width: 2.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <!-- your machine -->
  <rect class="line" x="10" y="30" width="580" height="600" rx="10" />
  <text class="label" x="26" y="22">your machine</text>

  <rect class="fill" x="280" y="48" width="260" height="50" rx="6" />
  <text class="dim" x="294" y="68">browser</text>
  <text class="label" x="294" y="88">https://myapp.localhost</text>

  <!-- your daemon, with the proxy and the listener for the box's port -->
  <rect class="fill" x="30" y="140" width="540" height="150" rx="8" />
  <text class="label" x="46" y="164">daemon</text>

  <rect class="line" x="250" y="150" width="310" height="50" rx="6" />
  <text class="label" x="264" y="172">proxy</text>
  <text class="dim" x="264" y="190">myapp.localhost to 127.0.0.1:28001</text>

  <rect class="line" x="250" y="220" width="310" height="50" rx="6" />
  <text class="label" x="264" y="242">listener</text>
  <text class="dim" x="264" y="260">127.0.0.1:28001</text>

  <text class="label" x="398" y="320" text-anchor="end">one connection</text>
  <text class="dim" x="398" y="338" text-anchor="end">docker exec, or SSH to a VPS</text>

  <!-- the box -->
  <rect class="line" x="30" y="350" width="540" height="262" rx="8" />
  <text class="label" x="46" y="374">devbox, a container on your machine's Docker</text>

  <rect class="fill" x="50" y="400" width="500" height="196" rx="8" />
  <text class="label" x="66" y="424">daemon</text>

  <rect class="line" x="250" y="436" width="280" height="146" rx="6" />
  <text class="label" x="264" y="458">myapp lane 0</text>
  <text class="dim" x="264" y="476">main</text>

  <rect class="fill" x="270" y="492" width="240" height="78" rx="5" />
  <text class="label" x="284" y="514">web</text>
  <text class="dim" x="284" y="536">myapp.localhost</text>
  <text class="dim" x="284" y="556">port 28001</text>

  <!-- the request: browser, proxy, listener, the connection, the box's daemon, web -->
  <path class="path" d="M 410 98 L 410 148" />
  <path class="path" d="M 403 139 L 410 150 L 417 139" />
  <path class="path" d="M 410 200 L 410 218" />
  <path class="path" d="M 403 209 L 410 220 L 417 209" />
  <path class="path" d="M 410 270 L 410 398" />
  <path class="path" d="M 403 389 L 410 400 L 417 389" />
  <path class="path" d="M 410 400 L 410 490" />
  <path class="path" d="M 403 481 L 410 492 L 417 481" />
</svg>
