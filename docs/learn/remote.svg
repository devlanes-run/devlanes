<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 545" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>my-vps and your machine joined by one connection; the browser on your machine opens https://myapp.localhost and reaches web on port 41001 on the box</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .path { stroke: var(--dl-diagram-accent, currentColor); fill: none; stroke-width: 2.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <!-- your machine -->
  <rect class="line" x="10" y="30" width="540" height="230" rx="10" />
  <text class="label" x="26" y="22">your machine</text>

  <text class="dim" x="296" y="60">browser</text>
  <text class="label" x="296" y="80">https://myapp.localhost</text>

  <!-- request: browser to proxy -->
  <path class="path" d="M 410 90 L 410 150" />
  <path class="path" d="M 403 141 L 410 152 L 417 141" />

  <rect class="fill" x="26" y="120" width="508" height="126" rx="8" />
  <text class="label" x="42" y="144">daemon</text>
  <text class="dim" x="42" y="176">your CA signs</text>
  <text class="dim" x="42" y="196">the box's hostnames</text>

  <rect class="line" x="288" y="154" width="230" height="34" rx="6" />
  <text class="label" x="302" y="176">proxy</text>

  <!-- request: proxy to the mirrored port -->
  <path class="path" d="M 410 188 L 410 198" />

  <rect class="line" x="288" y="198" width="230" height="34" rx="6" />
  <text class="label" x="302" y="220">port 41001</text>
  <text class="dim" x="404" y="220">mirrored</text>

  <!-- the connection between the machines -->
  <path class="path" d="M 410 232 L 410 450" />
  <path class="path" d="M 403 441 L 410 452 L 417 441" />
  <text class="label" x="424" y="288">one connection</text>
  <text class="dim" x="424" y="306">SSH or a command</text>

  <!-- the box -->
  <rect class="line" x="10" y="330" width="540" height="200" rx="10" />
  <text class="label" x="26" y="322">my-vps, the box</text>

  <rect class="fill" x="26" y="350" width="508" height="164" rx="8" />
  <text class="label" x="42" y="374">daemon</text>
  <text class="dim" x="42" y="394">start and stop</text>
  <text class="dim" x="42" y="414">run here</text>

  <rect class="line" x="288" y="364" width="230" height="136" rx="6" />
  <text class="label" x="302" y="386">myapp lane 0</text>
  <text class="dim" x="302" y="406">main</text>
  <rect class="line" x="302" y="452" width="202" height="34" rx="5" />
  <text class="label" x="314" y="474">web</text>
  <text class="dim" x="364" y="474">port 41001</text>
</svg>
