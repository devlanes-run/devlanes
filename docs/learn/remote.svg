<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>The browser on your machine opens https://myapp.localhost; your daemon sends the request over one connection to devbox, where web in myapp lane 0 answers</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .path { stroke: var(--dl-diagram-accent, currentColor); fill: none; stroke-width: 2.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <!-- your machine -->
  <rect class="line" x="10" y="30" width="540" height="180" rx="10" />
  <text class="label" x="26" y="22">your machine</text>

  <rect class="fill" x="150" y="48" width="260" height="50" rx="6" />
  <text class="dim" x="164" y="68">browser</text>
  <text class="label" x="164" y="88">https://myapp.localhost</text>

  <rect class="fill" x="150" y="140" width="260" height="50" rx="6" />
  <text class="label" x="164" y="170">daemon</text>

  <text class="label" x="296" y="244">one connection</text>

  <!-- the box -->
  <rect class="line" x="10" y="280" width="540" height="145" rx="10" />
  <text class="label" x="26" y="272">devbox</text>

  <rect class="line" x="130" y="298" width="300" height="112" rx="8" />
  <text class="label" x="146" y="320">myapp lane 0</text>
  <text class="dim" x="146" y="338">main</text>

  <rect class="fill" x="150" y="350" width="260" height="46" rx="6" />
  <text class="label" x="164" y="378">web</text>

  <!-- the request -->
  <path class="path" d="M 280 98 L 280 138" />
  <path class="path" d="M 273 129 L 280 140 L 287 129" />
  <path class="path" d="M 280 190 L 280 348" />
  <path class="path" d="M 273 339 L 280 350 L 287 339" />
</svg>
