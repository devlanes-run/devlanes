<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>A browser on your machine asks for api.myapp1.localhost; the proxy inside the daemon passes the request to the api of lane 1 of myapp, next to lane 0</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .path { stroke: var(--dl-diagram-accent, currentColor); fill: none; stroke-width: 2.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <rect class="line" x="10" y="30" width="540" height="320" rx="10" />
  <text class="label" x="26" y="22">your machine</text>

  <text class="dim" x="296" y="60">browser</text>
  <text class="label" x="296" y="80">https://api.myapp1.localhost</text>

  <!-- request: browser to proxy -->
  <path class="path" d="M 410 90 L 410 150" />
  <path class="path" d="M 403 141 L 410 152 L 417 141" />

  <rect class="fill" x="26" y="120" width="508" height="214" rx="8" />
  <text class="label" x="42" y="144">daemon</text>

  <rect class="line" x="42" y="154" width="476" height="34" rx="6" />
  <text class="label" x="56" y="176">proxy</text>
  <text class="dim" x="118" y="176">HTTPS for each hostname</text>

  <!-- request: proxy to lane 1 -->
  <path class="path" d="M 410 188 L 410 268" />
  <path class="path" d="M 403 259 L 410 270 L 417 259" />

  <rect class="line" x="42" y="210" width="230" height="108" rx="6" />
  <text class="label" x="56" y="232">myapp lane 0</text>
  <text class="dim" x="56" y="252">main</text>
  <rect class="line" x="56" y="270" width="202" height="34" rx="5" />
  <text class="label" x="68" y="292">api</text>
  <text class="dim" x="118" y="292">port 20060</text>

  <rect class="line" x="288" y="210" width="230" height="108" rx="6" />
  <text class="label" x="302" y="232">myapp lane 1</text>
  <text class="dim" x="302" y="252">feat/checkout</text>
  <rect class="line" x="302" y="270" width="202" height="34" rx="5" />
  <text class="label" x="314" y="292">api</text>
  <text class="dim" x="364" y="292">port 20070</text>
</svg>
