<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>The CLI, the TUI and the MCP server send requests to the daemon, which holds the processes of each lane, the proxy for hostnames over HTTPS, the state and the logs</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <text class="dim" x="20" y="30">send requests</text>
  <rect class="line" x="20" y="44" width="140" height="40" rx="6" />
  <text class="label" x="36" y="69">CLI</text>
  <rect class="line" x="20" y="116" width="140" height="40" rx="6" />
  <text class="label" x="36" y="141">TUI</text>
  <rect class="line" x="20" y="188" width="140" height="40" rx="6" />
  <text class="label" x="36" y="213">MCP server</text>

  <path class="line" d="M 160 64 L 210 64" />
  <path class="line" d="M 202 58 L 212 64 L 202 70" />
  <path class="line" d="M 160 136 L 210 136" />
  <path class="line" d="M 202 130 L 212 136 L 202 142" />
  <path class="line" d="M 160 208 L 210 208" />
  <path class="line" d="M 202 202 L 212 208 L 202 214" />

  <rect class="fill" x="214" y="20" width="366" height="236" rx="8" />
  <text class="label" x="230" y="44">daemon</text>

  <rect class="line" x="230" y="56" width="160" height="64" rx="6" />
  <text class="label" x="242" y="80">lane myapp@0</text>
  <text class="dim" x="242" y="102">processes</text>
  <rect class="line" x="404" y="56" width="160" height="64" rx="6" />
  <text class="label" x="416" y="80">lane myapp@1</text>
  <text class="dim" x="416" y="102">processes</text>

  <rect class="line" x="230" y="132" width="334" height="40" rx="6" />
  <text class="label" x="242" y="157">proxy</text>
  <text class="dim" x="300" y="157">hostnames over HTTPS</text>

  <rect class="line" x="230" y="184" width="160" height="56" rx="6" />
  <text class="label" x="242" y="206">state</text>
  <text class="dim" x="242" y="226">what each lane ran</text>
  <rect class="line" x="404" y="184" width="160" height="56" rx="6" />
  <text class="label" x="416" y="206">logs</text>
  <text class="dim" x="416" y="226">units' output</text>
</svg>
