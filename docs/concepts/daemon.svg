<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>The CLI, the TUI and the MCP server send requests to the daemon, which holds the processes of each lane, the proxy, the state and the logs</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <!-- clients -->
  <text class="dim" x="20" y="34">clients send requests</text>
  <rect class="line" x="20" y="48" width="140" height="40" rx="6" />
  <text class="label" x="36" y="73">CLI</text>
  <rect class="line" x="20" y="126" width="140" height="40" rx="6" />
  <text class="label" x="36" y="151">TUI</text>
  <rect class="line" x="20" y="204" width="140" height="40" rx="6" />
  <text class="label" x="36" y="229">MCP server</text>

  <path class="line" d="M 160 68 L 214 68" />
  <path class="line" d="M 206 62 L 216 68 L 206 74" />
  <path class="line" d="M 160 146 L 214 146" />
  <path class="line" d="M 206 140 L 216 146 L 206 152" />
  <path class="line" d="M 160 224 L 214 224" />
  <path class="line" d="M 206 218 L 216 224 L 206 230" />

  <!-- daemon -->
  <rect class="fill" x="218" y="20" width="362" height="264" rx="8" />
  <text class="label" x="234" y="44">daemon</text>

  <rect class="line" x="234" y="58" width="160" height="90" rx="6" />
  <text class="label" x="246" y="80">lane myapp@0</text>
  <text class="dim" x="246" y="104">processes</text>
  <text class="dim" x="246" y="124">api</text>

  <rect class="line" x="406" y="58" width="160" height="90" rx="6" />
  <text class="label" x="418" y="80">lane myapp@1</text>
  <text class="dim" x="418" y="104">processes</text>
  <text class="dim" x="418" y="124">api</text>

  <rect class="line" x="234" y="160" width="332" height="34" rx="6" />
  <text class="label" x="246" y="182">proxy</text>
  <text class="dim" x="310" y="182">ports and hostnames</text>

  <rect class="line" x="234" y="206" width="160" height="62" rx="6" />
  <text class="label" x="246" y="230">state</text>
  <text class="dim" x="246" y="252">what each lane ran</text>

  <rect class="line" x="406" y="206" width="160" height="62" rx="6" />
  <text class="label" x="418" y="230">logs</text>
  <text class="dim" x="418" y="252">units' output</text>
</svg>
