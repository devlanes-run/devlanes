<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>The CLI, the TUI and the MCP server send requests to the daemon, which holds the processes of each lane, the proxy for hostnames over HTTPS, the state and the logs; containers and boxes sit outside it. The first command starts the daemon, it exits when nothing runs, and after a reboot the lanes wait for a start from a shell</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <!-- clients -->
  <text class="dim" x="20" y="30">send requests</text>
  <rect class="line" x="20" y="44" width="120" height="40" rx="6" />
  <text class="label" x="34" y="69">CLI</text>
  <rect class="line" x="20" y="106" width="120" height="40" rx="6" />
  <text class="label" x="34" y="131">TUI</text>
  <rect class="line" x="20" y="168" width="120" height="40" rx="6" />
  <text class="label" x="34" y="193">MCP server</text>

  <path class="line" d="M 140 64 L 164 64" />
  <path class="line" d="M 157 58 L 167 64 L 157 70" />
  <path class="line" d="M 140 126 L 164 126" />
  <path class="line" d="M 157 120 L 167 126 L 157 132" />
  <path class="line" d="M 140 188 L 164 188" />
  <path class="line" d="M 157 182 L 167 188 L 157 194" />

  <!-- daemon -->
  <rect class="fill" x="168" y="20" width="300" height="236" rx="8" />
  <text class="label" x="184" y="42">daemon</text>

  <rect class="line" x="184" y="54" width="130" height="64" rx="6" />
  <text class="label" x="194" y="76">lane myapp@0</text>
  <text class="dim" x="194" y="100">processes</text>
  <rect class="line" x="324" y="54" width="130" height="64" rx="6" />
  <text class="label" x="334" y="76">lane myapp@1</text>
  <text class="dim" x="334" y="100">processes</text>

  <rect class="line" x="184" y="128" width="270" height="40" rx="6" />
  <text class="label" x="194" y="153">proxy</text>
  <text class="dim" x="246" y="153">hostnames over HTTPS</text>

  <rect class="line" x="184" y="178" width="130" height="64" rx="6" />
  <text class="label" x="194" y="200">state</text>
  <text class="dim" x="194" y="222">what ran</text>
  <rect class="line" x="324" y="178" width="130" height="64" rx="6" />
  <text class="label" x="334" y="200">logs</text>
  <text class="dim" x="334" y="222">units' output</text>

  <!-- outside the daemon -->
  <text class="dim" x="480" y="42">outside it</text>
  <rect class="line" x="480" y="54" width="112" height="64" rx="6" />
  <text class="label" x="490" y="76">containers</text>
  <text class="dim" x="490" y="100">keep running</text>
  <rect class="line" x="480" y="128" width="112" height="40" rx="6" />
  <text class="label" x="490" y="153">boxes</text>
  <path class="line" d="M 468 86 L 480 86" stroke-dasharray="3 3" />
  <path class="line" d="M 468 148 L 480 148" stroke-dasharray="3 3" />

  <!-- life of the daemon -->
  <text class="dim" x="20" y="292">life of the daemon</text>
  <rect class="line" x="20" y="304" width="176" height="56" rx="6" />
  <text class="label" x="32" y="326">first command</text>
  <text class="dim" x="32" y="346">starts it</text>
  <path class="line" d="M 196 332 L 210 332" />
  <path class="line" d="M 203 326 L 212 332 L 203 338" />
  <rect class="line" x="212" y="304" width="176" height="56" rx="6" />
  <text class="label" x="224" y="326">exits when</text>
  <text class="dim" x="224" y="346">nothing runs</text>
  <path class="line" d="M 388 332 L 402 332" />
  <path class="line" d="M 395 326 L 404 332 L 395 338" />
  <rect class="line" x="404" y="304" width="176" height="72" rx="6" />
  <text class="label" x="416" y="326">after a reboot</text>
  <text class="dim" x="416" y="346">lanes wait for a</text>
  <text class="dim" x="416" y="364">start from a shell</text>
</svg>
