<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>The port pool from 20000 to 32767 holds a block for each lane of myapp; in both blocks api has the first port and web the second, and the rest of the block is spare</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <text class="label" x="20" y="26">port pool (default range)</text>
  <rect class="line" x="20" y="38" width="560" height="30" rx="4" />
  <rect class="fill" x="20" y="38" width="26" height="30" />
  <rect class="fill" x="46" y="38" width="26" height="30" />
  <text class="dim" x="20" y="86">20000</text>
  <text class="dim" x="580" y="86" text-anchor="end">32767</text>

  <path class="line" d="M 33 68 L 165 112" />
  <path class="line" d="M 59 68 L 435 112" />

  <rect class="fill" x="40" y="112" width="250" height="108" rx="6" />
  <text class="label" x="54" y="134">myapp lane 0</text>
  <text class="dim" x="54" y="154">block 20000-20009</text>
  <rect class="line" x="54" y="166" width="72" height="40" rx="5" />
  <text class="label" x="62" y="184">api</text>
  <text class="dim" x="62" y="200">first</text>
  <rect class="line" x="132" y="166" width="72" height="40" rx="5" />
  <text class="label" x="140" y="184">web</text>
  <text class="dim" x="140" y="200">second</text>
  <rect class="line" x="210" y="166" width="66" height="40" rx="5" stroke-dasharray="4 3" />
  <text class="dim" x="218" y="191">spare</text>

  <rect class="fill" x="310" y="112" width="250" height="108" rx="6" />
  <text class="label" x="324" y="134">myapp lane 1</text>
  <text class="dim" x="324" y="154">block 20010-20019</text>
  <rect class="line" x="324" y="166" width="72" height="40" rx="5" />
  <text class="label" x="332" y="184">api</text>
  <text class="dim" x="332" y="200">first</text>
  <rect class="line" x="402" y="166" width="72" height="40" rx="5" />
  <text class="label" x="410" y="184">web</text>
  <text class="dim" x="410" y="200">second</text>
  <rect class="line" x="480" y="166" width="66" height="40" rx="5" stroke-dasharray="4 3" />
  <text class="dim" x="488" y="191">spare</text>

  <text class="dim" x="300" y="242" text-anchor="middle">each block is a lane's; the same place holds the same service</text>
</svg>
