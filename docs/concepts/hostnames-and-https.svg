<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>A browser asks for https://api.myapp1.localhost; the name resolves to 127.0.0.1; the proxy in the daemon finds the route, signs a certificate with the devlanes CA and passes the request to api of lane 1 on port 20070</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .path { stroke: var(--dl-diagram-accent, currentColor); fill: none; stroke-width: 2.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <rect class="line" x="10" y="30" width="580" height="300" rx="10" />
  <text class="label" x="26" y="22">your machine</text>

  <text class="dim" x="42" y="62">browser</text>
  <text class="label" x="42" y="82">https://api.myapp1.localhost</text>

  <!-- request: browser to proxy -->
  <path class="path" d="M 60 92 L 60 180" />
  <path class="path" d="M 53 171 L 60 182 L 67 171" />
  <text class="dim" x="78" y="120">the name resolves to 127.0.0.1</text>
  <text class="dim" x="78" y="140">TLS to port 443, asking for the name</text>

  <rect class="fill" x="26" y="152" width="548" height="164" rx="8" />
  <text class="label" x="420" y="174">daemon</text>

  <rect class="line" x="42" y="182" width="516" height="76" rx="6" />
  <text class="label" x="56" y="204">proxy</text>
  <text class="dim" x="120" y="204">finds the route for the hostname</text>
  <text class="dim" x="120" y="224">signs a certificate with the devlanes CA</text>
  <text class="dim" x="120" y="244">forwards over HTTP to 127.0.0.1:20070</text>

  <!-- request: proxy to the service -->
  <path class="path" d="M 60 258 L 60 280" />
  <path class="path" d="M 53 271 L 60 282 L 67 271" />

  <rect class="line" x="42" y="282" width="516" height="26" rx="5" />
  <text class="label" x="56" y="300">myapp lane 1</text>
  <text class="dim" x="200" y="300">api on port 20070</text>
</svg>
