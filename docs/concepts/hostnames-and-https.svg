<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>A browser asks for https://api.myapp1.localhost; the name resolves to 127.0.0.1; the proxy in the daemon finds the route, signs a certificate with the devlanes CA and forwards the request to api in lane 1, the site myapp1.localhost; lane 0 is the site myapp.localhost</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .path { stroke: var(--dl-diagram-accent, currentColor); fill: none; stroke-width: 2.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <rect class="line" x="10" y="30" width="580" height="360" rx="10" />
  <text class="label" x="26" y="22">your machine</text>

  <text class="dim" x="42" y="62">browser</text>
  <text class="label" x="42" y="82">https://api.myapp1.localhost</text>

  <!-- request: browser to proxy -->
  <path class="path" d="M 430 92 L 430 180" />
  <path class="path" d="M 423 171 L 430 182 L 437 171" />
  <text class="dim" x="42" y="120">the name resolves to 127.0.0.1</text>
  <text class="dim" x="42" y="140">TLS to port 443, asking for the name</text>

  <rect class="fill" x="26" y="152" width="548" height="222" rx="8" />
  <text class="label" x="42" y="174">daemon</text>

  <rect class="line" x="42" y="182" width="516" height="76" rx="6" />
  <text class="label" x="56" y="204">proxy</text>
  <text class="dim" x="120" y="204">finds the route for the hostname</text>
  <text class="dim" x="120" y="224">signs a certificate with the devlanes CA</text>
  <text class="dim" x="120" y="244">forwards the request over HTTP to 127.0.0.1:20070</text>

  <!-- request: proxy to the service in lane 1 -->
  <path class="path" d="M 430 258 L 430 274" />
  <path class="path" d="M 423 265 L 430 276 L 437 265" />

  <rect class="line" x="42" y="276" width="244" height="84" rx="6" />
  <text class="label" x="56" y="298">lane 0</text>
  <text class="dim" x="56" y="320">site myapp.localhost</text>
  <text class="dim" x="56" y="342">api on port 20060</text>

  <rect class="line" x="314" y="276" width="244" height="84" rx="6" />
  <text class="label" x="328" y="298">lane 1</text>
  <text class="dim" x="328" y="320">site myapp1.localhost</text>
  <text class="dim" x="328" y="342">api on port 20070</text>
</svg>
