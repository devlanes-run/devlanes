<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>A request from the browser on your machine goes through your proxy and a mirrored port, over one session by SSH or a command, to the devlanes tunnel on the box and the lane's service there; environments, secrets, logs, commands and either CA never cross</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .path { stroke: var(--dl-diagram-accent, currentColor); fill: none; stroke-width: 2.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <rect class="line" x="10" y="30" width="210" height="184" rx="10" />
  <text class="label" x="26" y="22">your machine</text>

  <rect class="line" x="26" y="46" width="178" height="34" rx="5" />
  <text class="label" x="40" y="68">browser</text>

  <rect class="fill" x="26" y="100" width="178" height="44" rx="5" />
  <text class="label" x="40" y="119">proxy</text>
  <text class="dim" x="40" y="136">your CA</text>

  <rect class="line" x="26" y="164" width="178" height="34" rx="5" />
  <text class="label" x="40" y="186">mirrored port</text>

  <!-- the request -->
  <path class="path" d="M 115 80 L 115 98" />
  <path class="path" d="M 109 90 L 115 100 L 121 90" />
  <path class="path" d="M 115 144 L 115 162" />
  <path class="path" d="M 109 154 L 115 164 L 121 154" />
  <path class="path" d="M 204 181 L 354 181" />
  <path class="path" d="M 345 175 L 356 181 L 345 187" />
  <path class="path" d="M 445 164 L 445 118" />
  <path class="path" d="M 439 126 L 445 116 L 451 126" />

  <text class="label" x="226" y="168" font-size="12">one session</text>
  <text class="dim" x="224" y="202" font-size="11">SSH or a command</text>

  <rect class="line" x="340" y="30" width="210" height="184" rx="10" />
  <text class="label" x="356" y="22">box</text>

  <rect class="fill" x="356" y="46" width="178" height="100" rx="6" />
  <text class="label" x="370" y="66">lane</text>
  <rect class="line" x="370" y="80" width="150" height="34" rx="5" />
  <text class="label" x="384" y="102">service</text>
  <text class="dim" x="370" y="136">on loopback</text>

  <rect class="line" x="356" y="164" width="178" height="34" rx="5" />
  <text class="label" x="370" y="186">devlanes tunnel</text>

  <text class="dim" x="20" y="252">never cross: environments, .env values, secrets, logs,</text>
  <text class="dim" x="20" y="272">terminal output, commands, either CA</text>
</svg>
