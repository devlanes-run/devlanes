<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>Your browser's request goes through your proxy and a mirrored port, or a relay port when that number stays local, over one session by SSH or a command, to the devlanes tunnel on the box and the lane's service; a client such as psql uses the mirrored port directly, and a synced folder copies the box's build output to your machine. Environments, secrets, logs, commands and either CA never cross</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .path { stroke: var(--dl-diagram-accent, currentColor); fill: none; stroke-width: 2.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <rect class="line" x="10" y="30" width="220" height="250" rx="10" />
  <text class="label" x="26" y="22">your machine</text>

  <rect class="line" x="26" y="44" width="90" height="30" rx="5" />
  <text class="label" x="36" y="64">browser</text>
  <rect class="line" x="128" y="44" width="86" height="30" rx="5" />
  <text class="label" x="140" y="64">psql</text>

  <rect class="fill" x="26" y="96" width="90" height="44" rx="5" />
  <text class="label" x="36" y="115">proxy</text>
  <text class="dim" x="36" y="132">your CA</text>

  <rect class="line" x="26" y="164" width="188" height="44" rx="5" />
  <text class="label" x="38" y="183">mirrored port</text>
  <text class="dim" x="38" y="200">or a relay port</text>

  <rect class="line" x="26" y="236" width="188" height="30" rx="5" />
  <text class="label" x="38" y="256">synced folder</text>

  <!-- the browser's request -->
  <path class="path" d="M 71 74 L 71 94" />
  <path class="path" d="M 65 86 L 71 96 L 77 86" />
  <path class="path" d="M 71 140 L 71 162" />
  <path class="path" d="M 65 154 L 71 164 L 77 154" />
  <path class="path" d="M 214 186 L 354 186" />
  <path class="path" d="M 345 180 L 356 186 L 345 192" />
  <path class="path" d="M 445 164 L 445 118" />
  <path class="path" d="M 439 126 L 445 116 L 451 126" />

  <!-- a direct client -->
  <path class="line" d="M 171 74 L 171 162" />
  <path class="line" d="M 165 154 L 171 164 L 177 154" />

  <text class="label" x="232" y="174" font-size="12">one session</text>
  <text class="dim" x="232" y="206" font-size="11">SSH or a command</text>

  <rect class="line" x="340" y="30" width="210" height="250" rx="10" />
  <text class="label" x="356" y="22">box</text>

  <rect class="fill" x="356" y="46" width="178" height="100" rx="6" />
  <text class="label" x="370" y="66">lane</text>
  <rect class="line" x="370" y="80" width="150" height="34" rx="5" />
  <text class="label" x="384" y="102">service</text>
  <text class="dim" x="370" y="136">on loopback</text>

  <rect class="line" x="356" y="164" width="178" height="44" rx="5" />
  <text class="label" x="370" y="190">devlanes tunnel</text>

  <rect class="line" x="356" y="236" width="178" height="30" rx="5" />
  <text class="label" x="370" y="256">build output</text>

  <!-- sync goes one way -->
  <path class="line" d="M 356 251 L 216 251" />
  <path class="line" d="M 225 245 L 214 251 L 225 257" />

  <text class="dim" x="20" y="306">never cross: environments, .env values, secrets, logs,</text>
  <text class="dim" x="20" y="326">terminal output, commands, either CA</text>
</svg>
