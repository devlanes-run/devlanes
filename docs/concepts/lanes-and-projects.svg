<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>Two worktrees of one repository, on main and feat/checkout; each holds a lane of myapp and a lane of billing, each lane with its own domain</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <rect class="line" x="10" y="30" width="580" height="290" rx="10" />
  <text class="label" x="26" y="22">repository</text>

  <!-- worktree on main -->
  <rect class="fill" x="26" y="48" width="272" height="258" rx="8" />
  <text class="label" x="42" y="72">worktree ~/dev/myapp</text>
  <text class="dim" x="42" y="92">branch main</text>

  <rect class="line" x="42" y="106" width="240" height="88" rx="6" />
  <text class="dim" x="56" y="128">devlanes.yaml</text>
  <text class="label" x="56" y="152">myapp lane 0</text>
  <text class="dim" x="56" y="176">domain myapp.localhost</text>

  <rect class="line" x="42" y="204" width="240" height="88" rx="6" />
  <text class="dim" x="56" y="226">apps/billing/devlanes.yaml</text>
  <text class="label" x="56" y="250">billing lane 0</text>
  <text class="dim" x="56" y="274">domain billing.localhost</text>

  <!-- worktree on feat/checkout -->
  <rect class="fill" x="312" y="48" width="272" height="258" rx="8" />
  <text class="label" x="328" y="72">worktree ~/dev/myapp-checkout</text>
  <text class="dim" x="328" y="92">branch feat/checkout</text>

  <rect class="line" x="328" y="106" width="240" height="88" rx="6" />
  <text class="dim" x="342" y="128">devlanes.yaml</text>
  <text class="label" x="342" y="152">myapp lane 1</text>
  <text class="dim" x="342" y="176">domain myapp1.localhost</text>

  <rect class="line" x="328" y="204" width="240" height="88" rx="6" />
  <text class="dim" x="342" y="226">apps/billing/devlanes.yaml</text>
  <text class="label" x="342" y="250">billing lane 1</text>
  <text class="dim" x="342" y="274">domain billing1.localhost</text>
</svg>
