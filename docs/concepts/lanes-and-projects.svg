<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>Two worktrees of myapp: ~/dev/myapp on main is lane 0 at myapp.localhost, ~/dev/myapp-checkout on feat/checkout is lane 1 at myapp1.localhost</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <text class="label" x="20" y="22">myapp: two worktrees</text>

  <rect class="fill" x="20" y="34" width="272" height="150" rx="8" />
  <text class="label" x="34" y="58">~/dev/myapp</text>
  <text class="dim" x="34" y="78">on main</text>
  <rect class="line" x="34" y="92" width="244" height="78" rx="6" />
  <text class="label" x="48" y="116">lane 0</text>
  <text class="dim" x="48" y="136">named main</text>
  <text class="dim" x="48" y="156">myapp.localhost</text>

  <rect class="fill" x="308" y="34" width="272" height="150" rx="8" />
  <text class="label" x="322" y="58">~/dev/myapp-checkout</text>
  <text class="dim" x="322" y="78">on feat/checkout</text>
  <rect class="line" x="322" y="92" width="244" height="78" rx="6" />
  <text class="label" x="336" y="116">lane 1</text>
  <text class="dim" x="336" y="136">named lane1</text>
  <text class="dim" x="336" y="156">myapp1.localhost</text>
</svg>
