<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>devlanes.yaml, devlanes.local.yaml, devlanes.prod.yaml and devlanes.prod.local.yaml merge in that order into one config, and a later file wins</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .path { stroke: var(--dl-diagram-accent, currentColor); fill: none; stroke-width: 2.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <text class="dim" x="20" y="22">merge order</text>

  <rect class="line" x="20" y="34" width="330" height="36" rx="6" />
  <text class="label" x="36" y="57">1  devlanes.yaml</text>
  <text class="dim" x="366" y="57">extended file</text>

  <rect class="line" x="20" y="82" width="330" height="36" rx="6" />
  <text class="label" x="36" y="105">2  devlanes.local.yaml</text>
  <text class="dim" x="366" y="105">its local file</text>

  <rect class="line" x="20" y="130" width="330" height="36" rx="6" />
  <text class="label" x="36" y="153">3  devlanes.prod.yaml</text>
  <text class="dim" x="366" y="153">the project file</text>

  <rect class="line" x="20" y="178" width="330" height="36" rx="6" />
  <text class="label" x="36" y="201">4  devlanes.prod.local.yaml</text>
  <text class="dim" x="366" y="201">its local file</text>

  <path class="path" d="M 185 214 L 185 240" />
  <path class="path" d="M 178 231 L 185 242 L 192 231" />

  <rect class="fill" x="20" y="244" width="330" height="40" rx="6" />
  <text class="label" x="36" y="269">one config</text>
  <text class="dim" x="366" y="269">a later file wins</text>
</svg>
