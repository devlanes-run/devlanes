<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>In the usual case devlanes.yaml and devlanes.local.yaml merge into one config; with extends, devlanes.yaml, devlanes.local.yaml, devlanes.prod.yaml and devlanes.prod.local.yaml merge in that order, a later file winning. Drift is the difference between what runs and what the config would start, and a reload applies it</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <!-- usual case -->
  <text class="dim" x="20" y="18">usual case</text>
  <rect class="line" x="20" y="28" width="240" height="32" rx="6" />
  <text class="label" x="34" y="49">devlanes.yaml</text>
  <rect class="line" x="20" y="66" width="240" height="32" rx="6" />
  <text class="label" x="34" y="87">devlanes.local.yaml</text>
  <path class="line" d="M 140 98 L 140 174" />
  <path class="line" d="M 134 166 L 140 176 L 146 166" />
  <rect class="fill" x="20" y="178" width="240" height="34" rx="6" />
  <text class="label" x="34" y="200">one config</text>

  <!-- with extends -->
  <text class="dim" x="300" y="18">with extends</text>
  <rect class="line" x="300" y="28" width="240" height="30" rx="6" />
  <text class="label" x="312" y="48">devlanes.yaml</text>
  <rect class="line" x="300" y="62" width="240" height="30" rx="6" />
  <text class="label" x="312" y="82">devlanes.local.yaml</text>
  <rect class="line" x="300" y="96" width="240" height="30" rx="6" />
  <text class="label" x="312" y="116">devlanes.prod.yaml</text>
  <rect class="line" x="300" y="130" width="240" height="30" rx="6" />
  <text class="label" x="312" y="150">devlanes.prod.local.yaml</text>
  <path class="line" d="M 420 160 L 420 174" />
  <path class="line" d="M 414 166 L 420 176 L 426 166" />
  <rect class="fill" x="300" y="178" width="240" height="34" rx="6" />
  <text class="label" x="312" y="200">one config</text>

  <text class="dim" x="20" y="234">top to bottom: a later file wins</text>

  <!-- drift -->
  <rect class="line" x="20" y="256" width="200" height="54" rx="6" />
  <text class="label" x="34" y="279">what runs</text>
  <text class="dim" x="34" y="298">started earlier</text>

  <rect class="line" x="340" y="256" width="200" height="54" rx="6" />
  <text class="label" x="352" y="279">what the config</text>
  <text class="label" x="352" y="298">would start</text>

  <text class="label" x="252" y="288">drift</text>
  <path class="line" d="M 220 283 L 246 283" />
  <path class="line" d="M 296 283 L 340 283" />

  <text class="dim" x="20" y="342">reload applies it: restarts what changed,</text>
  <text class="dim" x="20" y="362">stops what was removed, starts what was added</text>
</svg>
