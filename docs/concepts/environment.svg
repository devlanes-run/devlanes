<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>Seven layers of a unit's environment, from the shell that ran the start at the bottom to --env on the command line at the top, each with the name env show gives it; a higher layer wins</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .path { stroke: var(--dl-diagram-accent, currentColor); fill: none; stroke-width: 2.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <text class="dim" x="20" y="22">layer</text>
  <text class="dim" x="400" y="22">env show</text>

  <rect class="line" x="20" y="32" width="500" height="32" rx="5" />
  <text class="label" x="34" y="53">--env on the command line</text>
  <text class="dim" x="400" y="53">override</text>

  <rect class="line" x="20" y="72" width="500" height="32" rx="5" />
  <text class="label" x="34" y="93">the profile's env</text>
  <text class="dim" x="400" y="93">profile</text>

  <rect class="line" x="20" y="112" width="500" height="32" rx="5" />
  <text class="label" x="34" y="133">the unit's own env</text>
  <text class="dim" x="400" y="133">service</text>

  <rect class="line" x="20" y="152" width="500" height="32" rx="5" />
  <text class="label" x="34" y="173">global_env</text>
  <text class="dim" x="400" y="173">global</text>

  <rect class="fill" x="20" y="192" width="500" height="32" rx="5" />
  <text class="label" x="34" y="213">devlanes: PORT, HOST, DEVLANES_*</text>
  <text class="dim" x="400" y="213">devlanes</text>

  <rect class="fill" x="20" y="232" width="500" height="32" rx="5" />
  <text class="label" x="34" y="253">mise, direnv, runtime, preset</text>
  <text class="dim" x="400" y="253">contributor</text>

  <rect class="fill" x="20" y="272" width="500" height="32" rx="5" />
  <text class="label" x="34" y="293">the shell that ran the start</text>
  <text class="dim" x="400" y="293">client</text>

  <!-- precedence: higher wins -->
  <path class="path" d="M 556 304 L 556 40" />
  <path class="path" d="M 549 49 L 556 38 L 563 49" />
  <text class="label" x="580" y="22" text-anchor="end">wins</text>
</svg>
