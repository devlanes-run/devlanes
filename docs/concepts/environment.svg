<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>Seven layers of a unit's environment, from the shell that ran the start at the bottom to --env on the command line at the top, each with the name env show gives it; the higher layer wins</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <text class="label" x="20" y="22">seven layers of a unit's environment</text>
  <text class="dim" x="20" y="42">layer</text>
  <text class="dim" x="390" y="42">name in env show</text>

  <rect class="line" x="20" y="52" width="500" height="32" rx="5" />
  <text class="label" x="34" y="73">--env on the command line</text>
  <text class="dim" x="390" y="73">override</text>

  <rect class="line" x="20" y="92" width="500" height="32" rx="5" />
  <text class="label" x="34" y="113">the profile's env</text>
  <text class="dim" x="390" y="113">profile</text>

  <rect class="line" x="20" y="132" width="500" height="32" rx="5" />
  <text class="label" x="34" y="153">the unit's own env</text>
  <text class="dim" x="390" y="153">service</text>

  <rect class="line" x="20" y="172" width="500" height="32" rx="5" />
  <text class="label" x="34" y="193">global_env</text>
  <text class="dim" x="390" y="193">global</text>

  <rect class="line" x="20" y="212" width="500" height="32" rx="5" />
  <text class="label" x="34" y="233">devlanes: PORT, HOST, DEVLANES_*</text>
  <text class="dim" x="390" y="233">devlanes</text>

  <rect class="line" x="20" y="252" width="500" height="32" rx="5" />
  <text class="label" x="34" y="273">mise, direnv, runtime, preset</text>
  <text class="dim" x="390" y="273">contributor</text>

  <rect class="line" x="20" y="292" width="500" height="32" rx="5" />
  <text class="label" x="34" y="313">the shell that ran the start</text>
  <text class="dim" x="390" y="313">client</text>

  <!-- precedence -->
  <path class="line" d="M 556 324 L 556 60" />
  <path class="line" d="M 549 69 L 556 58 L 563 69" />
  <text class="label" x="580" y="342" text-anchor="end">the higher layer wins</text>
</svg>
