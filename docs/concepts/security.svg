<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>Who is checked where: processes running as you reach the daemon's socket or pipe and the CA key, which admit your account only; a sandbox's edge decides whether a process inside it gets through; SSH or a command decides who reaches a box, and the pairing check decides which machines see the box daemon's lanes</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .dash { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .path { stroke: var(--dl-diagram-accent, currentColor); fill: none; stroke-width: 2.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <!-- your machine -->
  <rect class="line" x="10" y="30" width="290" height="340" rx="10" />
  <text class="label" x="26" y="22">your machine</text>

  <rect class="line" x="26" y="44" width="258" height="44" rx="5" />
  <text class="label" x="40" y="62">other accounts</text>
  <text class="dim" x="40" y="79">refused at the socket or pipe</text>

  <rect class="fill" x="26" y="100" width="258" height="256" rx="8" />
  <text class="label" x="40" y="120">your account</text>

  <rect class="line" x="40" y="130" width="230" height="30" rx="5" />
  <text class="label" x="52" y="150">processes running as you</text>

  <rect class="line" x="40" y="182" width="106" height="30" rx="5" />
  <text class="label" x="52" y="202">CA key</text>

  <rect class="dash" x="164" y="174" width="106" height="46" rx="5" />
  <text class="label" x="174" y="193">sandbox</text>
  <text class="dim" x="174" y="211">edge decides</text>

  <rect class="line" x="40" y="250" width="230" height="92" rx="5" />
  <text class="label" x="52" y="270">daemon</text>
  <rect class="line" x="52" y="280" width="206" height="28" rx="4" />
  <text class="label" x="64" y="299">socket or pipe</text>
  <text class="dim" x="52" y="330">admits your account only</text>

  <!-- processes reach the CA key and the socket -->
  <path class="line" d="M 93 160 L 93 180" />
  <path class="line" d="M 87 172 L 93 182 L 99 172" />
  <path class="line" d="M 155 160 L 155 278" />
  <path class="line" d="M 149 270 L 155 280 L 161 270" />
  <path class="dash" d="M 217 220 L 217 278" />
  <path class="line" d="M 211 270 L 217 280 L 223 270" />

  <!-- box -->
  <rect class="line" x="320" y="30" width="270" height="340" rx="10" />
  <text class="label" x="336" y="22">box</text>

  <rect class="line" x="336" y="44" width="238" height="44" rx="5" />
  <text class="label" x="348" y="62">SSH or a command</text>
  <text class="dim" x="348" y="79">who reaches the box</text>

  <rect class="line" x="336" y="106" width="238" height="30" rx="5" />
  <text class="label" x="348" y="126">devlanes tunnel</text>

  <rect class="line" x="336" y="154" width="238" height="44" rx="5" />
  <text class="label" x="348" y="172">pairing check</text>
  <text class="dim" x="348" y="189">which machines see lanes</text>

  <rect class="fill" x="336" y="216" width="238" height="94" rx="6" />
  <text class="label" x="348" y="236">box daemon</text>
  <rect class="line" x="348" y="250" width="214" height="30" rx="4" />
  <text class="label" x="360" y="270">lanes</text>

  <path class="line" d="M 455 88 L 455 104" />
  <path class="line" d="M 449 96 L 455 106 L 461 96" />
  <path class="line" d="M 455 136 L 455 152" />
  <path class="line" d="M 449 144 L 455 154 L 461 144" />
  <path class="line" d="M 455 198 L 455 214" />
  <path class="line" d="M 449 206 L 455 216 L 461 206" />

  <!-- your daemon connects to the box -->
  <path class="path" d="M 270 296 L 310 296 L 310 66 L 332 66" />
  <path class="path" d="M 324 60 L 334 66 L 324 72" />
</svg>
