<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
  <title>A start runs containers, setup, tasks, services, then tasks after services, each phase once the one before it ended; each service waits at the start gate before it spawns</title>
  <style>
    .line { stroke: var(--dl-diagram-line, currentColor); fill: none; stroke-width: 1.5; }
    .fill { fill: var(--dl-diagram-fill, transparent); stroke: var(--dl-diagram-line, currentColor); stroke-width: 1.5; }
    .label { fill: currentColor; }
    .dim { fill: currentColor; opacity: 0.65; }
  </style>

  <text class="dim" x="20" y="16">each phase once the one before it ended</text>

  <rect class="line" x="20" y="28" width="520" height="40" rx="6" />
  <text class="label" x="36" y="53">containers</text>
  <text class="dim" x="196" y="53">shared and per-lane, until ready</text>

  <path class="line" d="M 280 68 L 280 86" />
  <path class="line" d="M 274 79 L 280 88 L 286 79" />

  <rect class="line" x="20" y="88" width="520" height="40" rx="6" />
  <text class="label" x="36" y="113">setup</text>
  <text class="dim" x="196" y="113">first start or after an edit, in parallel</text>

  <path class="line" d="M 280 128 L 280 146" />
  <path class="line" d="M 274 139 L 280 148 L 286 139" />

  <rect class="line" x="20" y="148" width="520" height="40" rx="6" />
  <text class="label" x="36" y="173">tasks</text>
  <text class="dim" x="196" y="173">one at a time, in file order</text>

  <path class="line" d="M 280 188 L 280 206" />
  <path class="line" d="M 274 199 L 280 208 L 286 199" />

  <rect class="fill" x="20" y="208" width="520" height="86" rx="6" />
  <text class="label" x="36" y="233">services</text>
  <text class="dim" x="196" y="233">all together, until ready or failed</text>
  <rect class="line" x="36" y="246" width="488" height="34" rx="5" />
  <text class="label" x="50" y="268">start gate</text>
  <text class="dim" x="196" y="268">each waits its turn, machine-wide</text>

  <path class="line" d="M 280 294 L 280 312" />
  <path class="line" d="M 274 305 L 280 314 L 286 305" />

  <rect class="line" x="20" y="314" width="520" height="56" rx="6" />
  <text class="label" x="36" y="339">after services</text>
  <text class="dim" x="196" y="339">tasks, only if every service</text>
  <text class="dim" x="196" y="357">became ready in time</text>
</svg>
