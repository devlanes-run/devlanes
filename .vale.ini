StylesPath = .vale/styles

MinAlertLevel = error

Packages = Google, Microsoft, RedHat, Salesforce, write-good, alex, ai-tells, Joblint, neighbor, Readability, proselint

[*.md]
BasedOnStyles = Vale, Google, Microsoft, RedHat, Salesforce, write-good, alex, ai-tells, Joblint, neighbor, Readability, proselint
# The website directives (:::tabs, ::example{...}) are not prose.
TokenIgnores = (?m)^:{2,4}[a-z].*$

# Needs a custom dictionary first.
Vale.Spelling = NO

# The docs use "do not" and "cannot" in places on purpose.
Microsoft.Contractions = NO
# Punctuation stays outside quotation marks, so a quoted command or key is exact.
Microsoft.Quotes = NO
Google.Quotes = NO
# auto-restart and auto-spawn are the names of behaviours.
Microsoft.Auto = NO
# Plain ASCII punctuation: straight quotes and three dots.
proselint.CurlyQuotes = NO
proselint.Ellipsis = NO
# Matches sizes and versions such as 80x24, and "!" in commands.
proselint.Multiplication = NO
proselint.Exclamation = NO
# The README's call to action ends in "!".
Google.Exclamation = NO
# resume and facade are the command and the design pattern, without accents.
proselint.Diacritical = NO
# ISO dates such as 2026-07-28 read as year ranges, and version numbers as repeated words.
proselint.DateRange = NO
proselint.LexicalIllusions = NO
# "backend" is the ratatui term, and the list bans ordinary words such as "and so on".
Microsoft.Avoid = NO
# Swaps terms the docs use on purpose: "trust store", "freezes" (a lane state), "the installer",
# "Firefox", "typo".
RedHat.TermsErrors = NO

# ai-tells flags phrases that are ordinary in technical prose: semicolons, tricolons of verbs,
# "keeps", "holds", "sits", "carries", "names", "every", "the named port", "Under nextest",
# the colon before a definition, and "given". The rules left on are the phrase-based ones.
ai-tells.SemicolonUsage = NO
ai-tells.VerbTricolon = NO
ai-tells.VerbTricolonDensity = NO
ai-tells.ConsequenceClause = NO
ai-tells.ConsequenceParticiple = NO
ai-tells.NegatedObject = NO
ai-tells.NegatedSubject = NO
ai-tells.NegatedPair = NO
ai-tells.ContrastiveNegation = NO
ai-tells.ContrastiveFormulas = NO
ai-tells.StrawmanContrast = NO
ai-tells.CoordinatedReveal = NO
ai-tells.NounString = NO
ai-tells.NamedAdjective = NO
ai-tells.EmptyPadding = NO
ai-tells.FillerIntensifier = NO
ai-tells.FormalRegister = NO
ai-tells.FormalTransitions = NO
ai-tells.HedgingPhrases = NO
ai-tells.OverusedVocabulary = NO
ai-tells.ColonUsage = NO
ai-tells.LabelAndExplain = NO
ai-tells.ServesAsDodge = NO
ai-tells.CataphoricForecasting = NO
ai-tells.ExplainerLeads = NO
ai-tells.ExplainerHeadings = NO
ai-tells.UnderRegime = NO
ai-tells.MicDrop = NO
ai-tells.StackedAnaphora = NO
ai-tells.ParallelStaccato = NO
ai-tells.DefensiveHedges = NO
ai-tells.UniversalSubject = NO
ai-tells.UniversalObject = NO
ai-tells.AbstractionSubject = NO
ai-tells.AnthropomorphicCognition = NO
ai-tells.AnthropomorphicJustification = NO
ai-tells.AnthropomorphicAdjectives = NO
ai-tells.BareNames = NO
ai-tells.BareReaches = NO
ai-tells.BareHolds = NO
ai-tells.ShipOveruse = NO
ai-tells.EnforcementMetaphors = NO
ai-tells.EvasionMetaphors = NO
ai-tells.MortalityMetaphors = NO
ai-tells.FigurativeCarries = NO
ai-tells.FigurativeFalls = NO
ai-tells.FigurativeHolds = NO
ai-tells.FigurativeIdioms = NO
ai-tells.FigurativeKeeps = NO
ai-tells.FigurativeLives = NO
ai-tells.FigurativeNouns = NO
ai-tells.FigurativeOwns = NO
ai-tells.FigurativeQuiet = NO
ai-tells.FigurativeShape = NO
ai-tells.FigurativeSits = NO
ai-tells.FigurativeStays = NO
