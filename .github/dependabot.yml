version: 2

# Every ecosystem runs daily and waits a week after a release before proposing it,
# so a yanked or compromised version is usually gone first. The wait does not apply to
# security updates. Each update gets its own pull request, so one that breaks the build
# doesn't hold back the rest; the dependabot workflow auto-merges each once CI passes.
# Packages that must move together share one whatever the update type. The pull request
# limit is high enough that it never holds updates back.
#
# Not covered on purpose:
# - rust-toolchain.toml: 1.99.1 is also in Cargo.toml, ci.yml and e2e/ssh/run.sh.
# - e2e/ssh/Dockerfile: its Debian release has to match the rust image in run.sh.
# - packaging/npm/devlanes: the release workflow sets those versions.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 100
    groups:
      tokio:
        patterns: [tokio, tokio-util, tokio-tungstenite]
      rustls:
        patterns: [rustls, rustls-pemfile, rustls-pki-types, tokio-rustls, webpki-root-certs]
      hyper:
        patterns: [hyper, hyper-util, http-body-util]
      tracing:
        patterns: [tracing, tracing-appender, tracing-subscriber]
      tui:
        patterns: [ratatui, crossterm, tui-term, vt100, vte, ratzilla]
      wasm:
        patterns: [wasm-bindgen, web-sys, console_error_panic_hook]
      diesel:
        patterns: [diesel, diesel_migrations, libsqlite3-sys]
    ignore:
      # Pinned with `=` in Cargo.toml: the protocol revisions the MCP server negotiates come with the version.
      - dependency-name: rmcp

  - package-ecosystem: npm
    directory: /crates/mcp-ui/ui
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 100
    groups:
      biome:
        patterns: ["@biomejs/*", "@arthurfiorette/biomejs-config"]
      rsbuild:
        patterns: ["@rsbuild/*"]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 100
