name: kache
description: >-
  Install the pinned kache release that .cargo/config.toml uses as rustc wrapper, and connect
  it to the shared S3 cache when the bucket and both keys are set. Without them, kache
  only uses the job's own local store.
inputs:
  s3-bucket:
    description: Remote cache bucket.
    required: false
    default: ""
  s3-endpoint:
    description: S3 endpoint, such as https://<account-id>.r2.cloudflarestorage.com for R2.
    required: false
    default: ""
  s3-region:
    description: Bucket region; "auto" for R2.
    required: false
    default: ""
  s3-access-key:
    description: Access key id for the bucket.
    required: false
    default: ""
  s3-secret-key:
    description: Secret access key for the bucket.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install kache
      shell: bash
      env:
        KACHE_VERSION: 2.3.0
      run: |
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) asset=kache-x86_64-unknown-linux-musl.tar.gz sha=60b6c507a1bfd396baba8670e0612feb5dda2c8460c8f02644328dde64359701 ;;
          Linux-ARM64) asset=kache-aarch64-unknown-linux-musl.tar.gz sha=c3f8dfeef93659eabbb00f7d58cdf882e33560ae61306bb784158ccfa7d02bd5 ;;
          macOS-ARM64) asset=kache-aarch64-apple-darwin.tar.gz sha=66a078e0cb85f80a80a365b61a646791d6fe27f2000832194cadf06deddd6438 ;;
          macOS-X64) asset=kache-x86_64-apple-darwin.tar.gz sha=45e33861306133dfd970de7301ed1e560b2db18f999528e2416556064e3e3719 ;;
          Windows-X64) asset=kache-x86_64-pc-windows-msvc.zip sha=07b723787880c0de128f6e9d1f52ee4f96948a574f108c574a4f58728daacf59 ;;
          Windows-ARM64) asset=kache-aarch64-pc-windows-msvc.zip sha=943013b221d867742cb4dd2a8e157e323f9d0f2f3edf16daae98f47a57c61a4a ;;
          *) echo "::error::no pinned kache release for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        dir=$RUNNER_TEMP/kache-bin
        mkdir -p "$dir"
        # Windows curl uses schannel, which fails with CRYPT_E_REVOCATION_OFFLINE when the
        # runner can't reach the revocation server. This flag accepts the certificate in that
        # case and still verifies the chain. Other TLS backends reject the flag.
        revoke=
        if [ "$RUNNER_OS" = Windows ]; then revoke=--ssl-revoke-best-effort; fi
        curl -fsSL --retry 3 $revoke -o "$dir/$asset" \
          "https://github.com/kunobi-ninja/kache/releases/download/v$KACHE_VERSION/$asset"
        if command -v sha256sum >/dev/null; then
          actual=$(sha256sum < "$dir/$asset")
        else
          actual=$(shasum -a 256 < "$dir/$asset")
        fi
        if [ "${actual%% *}" != "$sha" ]; then
          echo "::error::$asset does not match the pinned SHA-256"
          exit 1
        fi
        # kache runs compiles through kache-engine, which must come from the same release
        # and sit in the same directory.
        case $asset in
          *.zip) unzip -q -o "$dir/$asset" kache.exe kache-engine.exe -d "$dir" ;;
          *) tar -xzf "$dir/$asset" -C "$dir" kache kache-engine ;;
        esac
        rm "$dir/$asset"
        "$dir/kache" --version
        echo "$dir" >> "$GITHUB_PATH"
        # On the workspace's filesystem, so restores link into target/ instead of copying.
        echo "KACHE_CACHE_DIR=$RUNNER_TEMP/kache" >> "$GITHUB_ENV"
    # The daemon uploads what the build compiles and fetches what it misses. It drops
    # remote settings from the environment, so they go in the config file, and it keeps
    # the credentials it was started with, so only this step sees the secrets.
    - name: Connect the remote cache
      shell: bash
      env:
        BUCKET: ${{ inputs.s3-bucket }}
        ENDPOINT: ${{ inputs.s3-endpoint }}
        REGION: ${{ inputs.s3-region }}
        ACCESS_KEY: ${{ inputs.s3-access-key }}
        SECRET_KEY: ${{ inputs.s3-secret-key }}
        # Pushes to the default branch upload to `artifacts`. Pull requests read it, fall
        # back to `pr-artifacts` for what it lacks and upload only there, so they reuse each
        # other's work without ever reaching main's builds. Every other job is read-only;
        # kache also refuses uploads from any job that is neither a pull request nor a push
        # to a protected branch. The bucket's lifecycle rule expires `pr-artifacts/`.
        WRITE: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
      run: |
        set -euo pipefail
        if [ -z "$BUCKET" ] || [ -z "$ACCESS_KEY" ] || [ -z "$SECRET_KEY" ]; then
          echo "No remote cache configured; kache uses only this job's local store."
          exit 0
        fi
        config=$RUNNER_TEMP/kache.toml
        {
          echo "[cache]"
          # Records the key inputs of each compile, so a miss names what changed against an
          # earlier build of the same crate in this job's event log.
          echo "explain_miss = true"
          # remote_readonly would also stop a pull request from writing to its prefix.
          if [ "$WRITE" != true ] && [ "$PULL_REQUEST" != true ]; then echo "remote_readonly = true"; fi
          echo "[cache.remote]"
          echo 'type = "s3"'
          echo "bucket = \"$BUCKET\""
          echo 'prefix = "artifacts"'
          echo 'pull_request_prefix = "pr-artifacts"'
          if [ -n "$ENDPOINT" ]; then echo "endpoint = \"$ENDPOINT\""; fi
          if [ -n "$REGION" ]; then echo "region = \"$REGION\""; fi
        } > "$config"
        echo "KACHE_CONFIG=$config" >> "$GITHUB_ENV"
        KACHE_CONFIG=$config KACHE_S3_ACCESS_KEY=$ACCESS_KEY KACHE_S3_SECRET_KEY=$SECRET_KEY kache daemon start
