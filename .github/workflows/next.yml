name: Next
# Each commit on main that passes CI is built as `X.Y.(Z+1)-next.N`, where X.Y.Z is the
# committed version and N counts the commits since the last stable tag, so it sorts after
# the current release and before the next one. The build replaces the assets of the
# rolling `next` prerelease, which `DEVLANES_VERSION=next sh install.sh` installs. Nothing else is published: npm,
# Homebrew and the website only ever get stable releases from release.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Only the newest commit matters; `next` holds a single build.
concurrency:
  group: next
  cancel-in-progress: true
jobs:
  version:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The commit count since the last stable tag needs the history and tags.
          fetch-depth: 0
      - name: Next version
        id: version
        run: |
          next=$(python3 -c '
          import tomllib
          version = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          major, minor, patch = version.split("-")[0].split(".")
          print(f"{major}.{minor}.{int(patch) + 1}")
          ')
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' 2>/dev/null || true)
          count=$(git rev-list --count "${last:+$last..}HEAD")
          version=$next-next.$count
          echo "::notice::Building $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.sha }}
      snapshot: true

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums, release manifest and schemas
        run: |
          sh packaging/scripts/manifest.sh "$VERSION" dist \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/next"
          jq -e '.artifacts | length == 4' dist/release-manifest.json
          cp crates/config/schema.json crates/config/user-schema.json dist/
          cp install.sh dist/
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Replace the next release
        run: |
          repo=repos/$GITHUB_REPOSITORY
          if gh api "$repo/git/refs/tags/next" >/dev/null 2>&1; then
            gh api --method PATCH "$repo/git/refs/tags/next" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api "$repo/git/refs" -f ref=refs/tags/next -f sha="$SHA" >/dev/null
          fi
          notes=$RUNNER_TEMP/notes.md
          cat > "$notes" <<EOF
          Latest build of main: \`$VERSION\`, from $SHA.

          Not a release; it is replaced on every commit to main that passes CI. Install it with:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | DEVLANES_VERSION=next sh
          \`\`\`
          EOF
          # SHA256SUMS goes last and old archives are deleted after it, so install.sh
          # always finds the archives that the SHA256SUMS it read lists.
          set -- dist/*.tar.gz dist/release-manifest.json dist/schema.json dist/user-schema.json dist/install.sh
          if gh release view next >/dev/null 2>&1; then
            gh release edit next --prerelease --latest=false --title "devlanes next" --notes-file "$notes"
            gh release upload next --clobber "$@"
            gh release upload next --clobber dist/SHA256SUMS
            for asset in $(gh release view next --json assets --jq '.assets[].name'); do
              if [ ! -e "dist/$asset" ]; then
                gh release delete-asset next "$asset" --yes
              fi
            done
          else
            gh release create next --prerelease --latest=false --verify-tag \
              --title "devlanes next" --notes-file "$notes" "$@" dist/SHA256SUMS
          fi
