name: CI
on:
  # Branches are checked through their pull request; a push to every branch
  # would run the same checks twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request replaces its running checks. Every other run gets
# its own group, so each commit on main finishes and uploads its kache entries.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  # Decides which jobs below run and whose tests the rust job runs, from the files that
  # differ from a commit whose checks passed: a pull request's base, or on main the last
  # commit whose CI run passed. A passing run vouches for every test it left out, since
  # nothing those tests read changed. .github/scripts/affected.py has the rules; a run by
  # hand (workflow_dispatch) runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      lint: ${{ steps.affected.outputs.lint }}
      rust: ${{ steps.affected.outputs.rust }}
      tests: ${{ steps.affected.outputs.tests }}
      e2e: ${{ steps.affected.outputs.e2e }}
      web: ${{ steps.affected.outputs.web }}
      packaging: ${{ steps.affected.outputs.packaging }}
      mcp_ui: ${{ steps.affected.outputs.mcp_ui }}
      next: ${{ steps.affected.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base branch.
          fetch-depth: 2
      - id: affected
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          # cargo metadata only reads the manifests, so the runner's stable toolchain is
          # enough and this job installs none.
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          # Fetches commit $1 and prints it, or prints nothing when there is none.
          # git diff compares the two trees, so the commit alone is enough.
          fetch() {
            if [ -n "$1" ] && git fetch --quiet --depth=1 origin "$1"; then echo "$1"; fi
          }
          base=
          case $EVENT in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push)
              base=$(fetch "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$GITHUB_REF_NAME" \
                --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""')")
              ;;
          esac
          # shellcheck disable=SC2086 # an empty base is no argument
          python3 .github/scripts/affected.py $base | grep -v '^next=' >> "$GITHUB_OUTPUT"
          # `next` ships what changed since the commit the prerelease was built from,
          # which is older than base when commits since then changed nothing it ships.
          if [ "$EVENT" = push ]; then
            published=$(fetch "$(git ls-remote origin refs/tags/next | cut -f1)")
            # shellcheck disable=SC2086
            python3 .github/scripts/affected.py $published | grep '^next=' >> "$GITHUB_OUTPUT"
          fi
  # Separate from the rust job so clippy and the test build run in parallel; on
  # Windows they take about 5 and 10 minutes.
  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: ./.github/actions/kache
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
      # Formatting is the same on every OS; clippy sees each OS's cfg code.
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: kache stats
        if: ${{ !cancelled() }}
        run: |
          # --full adds the "Not cached" reasons and the remote upload and download counts.
          kache stats --full
          # Lets the daemon finish its queued uploads before the runner goes away.
          kache daemon stop
  # The TUI web demo (crates/tui-web) builds devlanes-tui and the crates under it for
  # the browser, where sockets, processes and crossterm do not compile; this keeps
  # native-only code out of that build. It also builds the bundle as release.yml's
  # tui-web job does, so a release never meets a broken bundle build first.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: ./.github/actions/kache
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
      - run: cargo clippy -p devlanes-tui-web --target wasm32-unknown-unknown --locked -- -D warnings
      # As in release.yml's tui-web job.
      - name: wasm-bindgen version
        id: bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { found = 1; next } found && /^version = / { gsub(/"/, "", $3); print $3; exit }' Cargo.lock)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - name: Install wasm-opt
        env:
          BINARYEN_VERSION: "133"
          BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
        run: |
          set -euo pipefail
          archive=$RUNNER_TEMP/binaryen.tar.gz
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/binaryen-version_$BINARYEN_VERSION-x86_64-linux.tar.gz"
          echo "$BINARYEN_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"
      - run: sh packaging/scripts/tui-web.sh "$RUNNER_TEMP/web"
      - name: kache stats
        if: ${{ !cancelled() }}
        run: |
          kache stats --full
          kache daemon stop
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows compiles and links about twice as slowly, and the large sync test
    # alone takes four minutes on NTFS.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: ./.github/actions/kache
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
      # Test homes, repositories and the daemons' temporary files go to the
      # runner's work drive, next to the checkout and target, instead of the
      # profile's AppData\Local\Temp on the system drive. RUNNER_TEMP itself
      # grants other accounts access, and devlanes refuses a home others
      # can reach, so they get a subdirectory as private as a profile's temp.
      - name: Use the runner's temp directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $user = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $dir /inheritance:r /grant:r "*${user}:(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "TMP=$dir" >> $env:GITHUB_ENV
          "TEMP=$dir" >> $env:GITHUB_ENV
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: nextest
      # The default nextest profile leaves out devlanes-e2e; the e2e jobs run it.
      # Every nextest step runs all its tests and repeats failed output at the end, so
      # one failure neither hides the others nor gets buried in the PASS lines.
      # Every test binary is built, so the kache entries stay those of a workspace
      # build, and TESTS picks which packages' tests run; empty runs them all.
      - name: Tests
        shell: bash
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
        run: cargo nextest run --workspace --all-features --locked --no-fail-fast --failure-output immediate-final ${TESTS:+--no-tests=pass -E "$TESTS"}
      # Only the Linux runners have Docker. This reuses the test binaries built above.
      - name: Docker tests
        if: runner.os == 'Linux'
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
        run: |
          docker info
          docker compose version
          filter='test(/(^|::)docker_/)'
          cargo nextest run --workspace --all-features --locked --no-fail-fast --failure-output immediate-final --run-ignored only \
            ${TESTS:+--no-tests=pass} -E "${TESTS:+($TESTS) & }$filter"
      - run: cargo test --workspace --doc --all-features --locked
      - name: kache stats
        if: ${{ !cancelled() }}
        run: |
          # --full adds the "Not cached" reasons and the remote upload and download counts.
          kache stats --full
          # Lets the daemon finish its queued uploads before the runner goes away.
          kache daemon stop
  packaging:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: shellcheck
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive=$RUNNER_TEMP/actionlint.tar.gz
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: actionlint
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - run: sh packaging/scripts/check.sh
  # install.ps1, package.ps1 and the npm launcher on Windows, against a fake
  # devlanes.exe, so no Rust build is needed.
  packaging-windows:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PSSCRIPTANALYZER_VERSION: 1.25.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The PowerShell Gallery sometimes fails a download ("Source Location ...
      # is not valid"), so the module is cached and only fetched, with retries,
      # when the cache misses.
      - name: Locate the user module directory
        id: modules
        run: |
          $dir = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\Modules'
          New-Item -ItemType Directory -Force $dir | Out-Null
          "dir=$dir" >> $env:GITHUB_OUTPUT
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.modules.outputs.dir }}\PSScriptAnalyzer
          key: psscriptanalyzer-${{ env.PSSCRIPTANALYZER_VERSION }}
      - name: Install PSScriptAnalyzer
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MODULES: ${{ steps.modules.outputs.dir }}
        run: |
          for ($attempt = 1; ; $attempt++) {
            try {
              Save-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Repository PSGallery -Path $env:MODULES -Force -ErrorAction Stop
              break
            } catch {
              if ($attempt -ge 4) { throw }
              Write-Warning "PSScriptAnalyzer download failed (attempt $attempt): $_"
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
      - run: ./packaging/scripts/check.ps1
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows builds take longer.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 30 }}
    env:
      DEVLANES_E2E_BIN_DIR: ${{ github.workspace }}/target/debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: ./.github/actions/kache
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
      # As in the rust job.
      - name: Use the runner's temp directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $user = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $dir /inheritance:r /grant:r "*${user}:(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "TMP=$dir" >> $env:GITHUB_ENV
          "TEMP=$dir" >> $env:GITHUB_ENV
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: nextest
      # Built once here; each nextest test process would otherwise run cargo build
      # itself (on Windows tests never build, so the binaries must exist first).
      - run: cargo build -p devlanes -p devlanes-testing --locked
      # -p: the e2e profile only runs devlanes-e2e, and without it nextest would build
      # every other package's test binaries too.
      - run: cargo nextest run -p devlanes-e2e --profile e2e --locked --no-fail-fast --failure-output immediate-final
      # Only the Linux runners have Docker.
      - name: Docker tests
        if: runner.os == 'Linux'
        run: |
          docker info
          docker compose version
          cargo nextest run -p devlanes-e2e --profile e2e --locked --no-fail-fast --failure-output immediate-final --run-ignored only -E 'test(/(^|::)docker_/)'
      - name: kache stats
        if: ${{ !cancelled() }}
        run: |
          # --full adds the "Not cached" reasons and the remote upload and download counts.
          kache stats --full
          # Lets the daemon finish its queued uploads before the runner goes away.
          kache daemon stop
  ssh:
    # `needs ssh` tests against a throwaway sshd container; the script builds the box's
    # Linux devlanes in rust:1.99.1-bookworm and always removes the container.
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: ./.github/actions/kache
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
      # The box binary's target dir and registry, built inside the container.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ssh-box
          key: ssh-box-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ssh-box-
      - run: docker info
      - run: bash e2e/ssh/run.sh
        env:
          DEVLANES_TEST_SSH_CACHE: ${{ runner.temp }}/ssh-box
      - name: kache stats
        if: ${{ !cancelled() }}
        run: |
          # --full adds the "Not cached" reasons and the remote upload and download counts.
          kache stats --full
          # Lets the daemon finish its queued uploads before the runner goes away.
          kache daemon stop
  # The MCP Apps card is built with Node and committed (crates/mcp-ui/ui/dist/lane.html),
  # so the Rust build never runs Node. This checks its source and that the committed
  # file is what `pnpm build` writes from it.
  mcp-ui:
    needs: changes
    if: needs.changes.outputs.mcp_ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/mcp-ui/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs pnpm from packageManager and Node from devEngines.runtime, then runs pnpm install.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          install: true
          require-lockfile: true
          working-directory: crates/mcp-ui/ui
      - run: pnpm lint-ci
      - run: pnpm test-types
      - run: pnpm build
      - name: Check the committed card
        run: |
          if ! git diff --exit-code --text --stat -- dist/lane.html; then
            echo "::error file=crates/mcp-ui/ui/dist/lane.html::dist/lane.html is stale. Run pnpm build in crates/mcp-ui/ui and commit the file."
            exit 1
          fi

  # The one check the main branch requires. The jobs above are skipped when a change
  # can't affect them, and a skipped job passes; a failed or cancelled one fails this.
  ci:
    if: always()
    needs: [changes, lint, web, rust, packaging, packaging-windows, e2e, ssh, mcp-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' >/dev/null; then
            exit 1
          fi

  # A push to main that passed every job above builds the rolling `next` prerelease in
  # this same run, so its build and publish jobs show in the commit's checks. A commit
  # that changes nothing it ships leaves the last one in place.
  next:
    if: github.event_name == 'push' && needs.changes.outputs.next == 'true'
    needs: [changes, ci]
    uses: ./.github/workflows/next.yml
    secrets: inherit
    # The most next.yml's jobs may use: publish replaces release assets and attests them.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
