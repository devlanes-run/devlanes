name: Sampo
# Sampo's action keeps the release pull request (branch release/main) up to date while
# change files are pending, and tags the new devlanes version once it merges. It pushes
# with the bot App's token (packaging/README.md, "Credentials"), so the release pull
# request runs CI and the tag starts release.yml. Without the App it falls back to
# GITHUB_TOKEN, whose pushes start no workflows, and the last step starts release.yml.
# packaging/README.md has the details.
on:
  push:
    branches: [main]
permissions:
  contents: read
# A newer push must not cancel a run halfway through pushing tags, nor one still waiting:
# the run for a release PR's merge is the one that tags it.
concurrency:
  group: sampo
  cancel-in-progress: false
  queue: max
jobs:
  sampo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Used only without the App, by the GITHUB_TOKEN fallback.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: bot
        name: Check for the bot App
        env:
          CLIENT_ID: ${{ vars.BOT_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No bot App configured (vars.BOT_APP_CLIENT_ID and secrets.BOT_APP_PRIVATE_KEY), so Sampo pushes with GITHUB_TOKEN and the release pull request gets no CI"
          fi
      - id: app-token
        name: Create the bot App token
        if: steps.bot.outputs.configured == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # The force-push of release/main carries every workflow change merged to main
          # since its last update, which GitHub refuses from an App without it.
          permission-workflows: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sampo links changelog entries to the commits that added their change files.
          fetch-depth: 0
          # Sampo pushes release/main and the tags with `git push origin`, which uses the
          # credentials checkout persists; its API calls use GITHUB_TOKEN below.
          token: ${{ steps.app-token.outputs.token || github.token }}
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Sampo's action otherwise pipes cargo-binstall's install script from its main
      # branch into bash; it skips that when cargo-binstall is already installed.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-binstall@1.25.3
      - id: sampo
        uses: bruits/sampo/crates/sampo-github-action@dc653d6ac85c45f139b0af898fb2dd1507f3fcd8 # cargo-sampo-github-action-v0.22.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

      # `published` means publish created a tag, and `tag_unpublished` in
      # .sampo/config.toml leaves the devlanes one as the only candidate. A tag the App
      # pushed starts release.yml on its own, and a second run of the same tag would
      # publish it again once the first finished, so this dispatches only without it.
      - name: Start the release
        if: steps.sampo.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.bot.outputs.configured == 'true' }}
        run: |
          tag=$(git tag --points-at HEAD --list 'v[0-9]*' | head -n 1)
          if [ -z "$tag" ]; then
            echo "::error::Sampo reported a publish but this commit has no vX.Y.Z tag"
            exit 1
          fi
          if [ "$APP" = true ]; then
            echo "::notice::Pushed $tag with the bot App's token; its push starts release.yml"
            exit 0
          fi
          gh workflow run release.yml --ref "$tag"
          echo "::notice::Started release.yml for $tag"
