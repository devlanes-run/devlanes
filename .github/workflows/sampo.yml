name: Sampo
# Sampo's action keeps the release pull request (branch release/main) up to date while
# change files are pending, and tags the new devlanes version once it merges. The step
# after it starts release.yml, which Sampo's tags don't. packaging/README.md has the
# details.
on:
  push:
    branches: [main]
permissions:
  contents: read
# A newer push must not cancel a run halfway through pushing tags, nor one still waiting:
# the run for a release PR's merge is the one that tags it.
concurrency:
  group: sampo
  cancel-in-progress: false
  queue: max
jobs:
  sampo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sampo links changelog entries to the commits that added their change files.
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Sampo's action otherwise pipes cargo-binstall's install script from its main
      # branch into bash; it skips that when cargo-binstall is already installed.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-binstall@1.25.3
      - id: sampo
        uses: bruits/sampo/crates/sampo-github-action@01b484549021f6f458c5aa93820d4a63a39d9485 # cargo-sampo-github-action-v0.22.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # `published` means publish created a tag, and `tag_unpublished` in
      # .sampo/config.toml leaves the devlanes one as the only candidate.
      - name: Start the release
        if: steps.sampo.outputs.published == 'true'
        run: |
          tag=$(git tag --points-at HEAD --list 'v[0-9]*' | head -n 1)
          if [ -z "$tag" ]; then
            echo "::error::Sampo reported a publish but this commit has no vX.Y.Z tag"
            exit 1
          fi
          gh workflow run release.yml --ref "$tag"
          echo "::notice::Started release.yml for $tag"
