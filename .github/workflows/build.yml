name: Build
# Builds devlanes and devlanes-hosts for every release target and uploads one
# `dist-TARGET` artifact with the packed archive. release.yml calls it for a `v*` tag,
# next.yml for each commit on main that passes CI.
on:
  workflow_call:
    inputs:
      version:
        description: Version the binaries report and the archives are named after.
        required: true
        type: string
      ref:
        description: Commit to build; empty builds the caller's ref.
        required: false
        type: string
        default: ""
      snapshot:
        description: >-
          Write `version` into the workspace before building instead of requiring the
          committed versions to match it. For next.yml, whose versions are never committed.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          # Cross-compiled on the arm64 runner, so it is built but not executed.
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
          # 22.04 runners keep the glibc requirement at 2.35, so the binaries also
          # run on Debian 12 and Ubuntu 22.04 hosts that SSH bootstrap installs onto.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            native: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            native: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
      # kache passes every compile straight to rustc here: shipped binaries are always
      # compiled from source, and release targets share no cache entries with CI anyway.
      KACHE_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      # .cargo/config.toml names kache as rustc wrapper, so it must exist even when disabled.
      - uses: ./.github/actions/kache
      - name: Write the snapshot version
        if: inputs.snapshot
        run: |
          sed -i.orig "/^\[workspace.package\]/,/^\[/ s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          rm Cargo.toml.orig
          cargo update --workspace --quiet
      - name: Check the version against the workspace and plugin versions
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "devlanes") | .version')
          plugin=$(jq -r .version agent-plugin/.claude-plugin/plugin.json)
          if [ "$VERSION" != "$crate" ]; then
            echo "::error::version $VERSION and devlanes $crate must match"
            exit 1
          fi
          if [ "$SNAPSHOT" != true ] && [ "$VERSION" != "$plugin" ]; then
            echo "::error::version $VERSION and agent-plugin/.claude-plugin/plugin.json $plugin must match"
            exit 1
          fi
      - name: Build
        # The build ID marks official builds in the daemon handshake and doctor; others say local.
        env:
          DEVLANES_BUILD_ID: v${{ inputs.version }}
        run: cargo build --release --locked --target "$TARGET" -p devlanes -p devlanes-hosts-helper
      # build.rs regenerates the served schemas; a difference means they were committed stale.
      # Snapshots differ anyway, since the schemas name the version.
      - name: Check the committed schemas
        if: ${{ !inputs.snapshot }}
        run: git diff --exit-code crates/config/schema.json crates/config/user-schema.json
      - name: Smoke test
        if: matrix.native
        run: |
          "target/$TARGET/release/devlanes" --version | grep -Fx "devlanes $VERSION"
          "target/$TARGET/release/devlanes-hosts" version | grep -F "build=release"
      - name: Package
        run: sh packaging/scripts/package.sh "$VERSION" "$TARGET" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
