name: Build
# Builds devlanes (and devlanes-hosts on macOS and Linux) for every release target and
# uploads one `dist-TARGET` artifact with the packed archive and the debug archive
# (package-debug.sh, CONTRIBUTING.md "Symbolicating a report"). release.yml calls it for a
# `v*` tag, next.yml for each commit on main that passes CI. Callers pass `secrets: inherit`
# for the kache bucket: next builds run in CI's push run on main, so they upload, and a
# release build downloads what they compiled with the same profile and targets (the kache
# action makes every event but a push to main read-only).
on:
  workflow_call:
    inputs:
      version:
        description: Version the binaries report and the archives are named after.
        required: true
        type: string
      ref:
        description: Commit to build; empty builds the caller's ref.
        required: false
        type: string
        default: ""
      snapshot:
        description: >-
          Write `version` into the crates that carry the release version before building,
          instead of requiring the committed version to match it. For next.yml, whose
          versions are never committed.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
env:
  # The `fixed` group in .sampo/config.toml, whose version is the release's;
  # devlanes-version reads it from the first.
  FIXED: bins/devlanes/Cargo.toml crates/hosts-helper/Cargo.toml
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          # Cross-compiled on the arm64 runner, so it is built but not executed.
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
          # 22.04 runners keep the glibc requirement at 2.35, so the binaries also
          # run on Debian 12 and Ubuntu 22.04 hosts.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            native: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            native: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: ./.github/actions/kache
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
      - name: Write the snapshot version
        if: inputs.snapshot
        run: |
          for manifest in $FIXED; do
            sed -i.orig "s/^version = \".*\"/version = \"$VERSION\"/" "$manifest"
            rm "$manifest.orig"
          done
          cargo update --workspace --quiet
      - name: Check the version against the workspace version
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "devlanes") | .version')
          if [ "$VERSION" != "$crate" ]; then
            echo "::error::version $VERSION and devlanes $crate must match"
            exit 1
          fi
      - name: Build
        # The build ID marks official builds in the daemon handshake and doctor; others say local.
        # The CARGO_PROFILE_RELEASE_* variables add line tables for the debug archive
        # (Cargo.toml's release profile has none). On macOS rustc runs dsymutil for the
        # .dSYM and only then strips the binary. On Linux it would strip during the link,
        # so the binary is linked unstripped and the next step splits it.
        #
        # On macOS kache must not cache binaries (build scripts included, they are bins
        # too). For a bin it stores, kache adds `-Wl,-oso_prefix,<profile dir>/`, so the
        # debug map names objects relative to a directory rustc's dsymutil doesn't run in,
        # and after rustc returns it runs its own dsymutil on the stripped binary,
        # replacing rustc's .dSYM with one that has the UUID and no DWARF. Seen in 1.2.2;
        # the prefix was last checked in 2.3.0's source.
        env:
          DEVLANES_BUILD_ID: v${{ inputs.version }}
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ runner.os == 'macOS' && 'packed' || 'off' }}
          CARGO_PROFILE_RELEASE_STRIP: ${{ runner.os == 'macOS' && 'symbols' || 'none' }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export KACHE_CACHE_EXECUTABLES=0; fi
          cargo build --release --locked --target "$TARGET" -p devlanes -p devlanes-hosts-helper
      # The debug files must describe the shipped binaries: the same UUID (macOS) or
      # build ID (Linux). dsymutil writes a .dSYM with the binary's UUID even when it finds
      # no debug map, so on macOS it must also hold compile units, line rows and a symbol
      # table in which atos finds `main`.
      - name: Collect the debug files
        run: |
          set -eu
          debug=$RUNNER_TEMP/debug
          mkdir -p "$debug"
          case $TARGET in
            aarch64-*) arch=arm64 ;;
            *) arch=x86_64 ;;
          esac
          for bin in devlanes devlanes-hosts; do
            exe=target/$TARGET/release/$bin
            if [ "$RUNNER_OS" = macOS ]; then
              want=$(dwarfdump --uuid "$exe" | awk '{ print $2 }')
              got=$(dwarfdump --uuid "$exe.dSYM" | awk '{ print $2 }')
              units=$(dwarfdump --debug-info "$exe.dSYM" | grep -c DW_TAG_compile_unit || true)
              rows=$(dwarfdump --debug-line "$exe.dSYM" | grep -c '^0x' || true)
              main=$(nm "$exe.dSYM"/Contents/Resources/DWARF/* | awk '$3 == "_main" { print $1 }')
              resolved=$(atos -o "$exe.dSYM" -arch "$arch" "0x${main:-0}" || true)
              echo "$bin.dSYM: $units compile units, $rows line rows, 0x${main:-?} is $resolved"
              if [ "$units" -eq 0 ] || [ "$rows" -eq 0 ] || [ "${resolved#main (in }" = "$resolved" ]; then
                echo "::error::$bin.dSYM has no debug info: $units compile units, $rows line rows, main resolves to '$resolved'"
                exit 1
              fi
              cp -RL "$exe.dSYM" "$debug/"
            else
              objcopy --only-keep-debug "$exe" "$debug/$bin.debug"
              # --strip-all is what `strip = true` passes to the linker.
              objcopy --strip-all "$exe"
              objcopy --add-gnu-debuglink="$debug/$bin.debug" "$exe"
              want=$(readelf -n "$exe" | awk '/Build ID:/ { print $3 }')
              got=$(readelf -n "$debug/$bin.debug" | awk '/Build ID:/ { print $3 }')
            fi
            if [ -z "$want" ] || [ "$want" != "$got" ]; then
              echo "::error::the debug file of $bin does not match it: '$want' and '$got'"
              exit 1
            fi
            echo "$bin: $want"
          done
          ls -l "target/$TARGET/release/devlanes" "target/$TARGET/release/devlanes-hosts"
          du -sh "$debug"/*
      # build.rs regenerates the served schemas; a difference means they were committed stale.
      - name: Check the committed schemas
        run: git diff --exit-code crates/config/schema.json crates/config/user-schema.json
      - name: Smoke test
        if: matrix.native
        run: |
          "target/$TARGET/release/devlanes" --version | grep -Fx "devlanes $VERSION"
          "target/$TARGET/release/devlanes-hosts" version | grep -F "build=release"
      - name: Package
        run: |
          sh packaging/scripts/package.sh "$VERSION" "$TARGET" dist
          sh packaging/scripts/package-debug.sh "$VERSION" "$TARGET" dist "$RUNNER_TEMP"/debug/*
      - name: kache stats
        if: ${{ !cancelled() }}
        run: |
          kache stats
          # Lets the daemon finish its queued uploads before the runner goes away.
          kache daemon stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  build-windows:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # Native arm64 runner, so the binary is executed like the x64 one.
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: ./.github/actions/kache
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
      # The build job checks the version against the workspace version; the
      # smoke test below ties this binary to it.
      - name: Write the snapshot version
        if: inputs.snapshot
        run: |
          for manifest in $FIXED; do
            sed -i.orig "s/^version = \".*\"/version = \"$VERSION\"/" "$manifest"
            rm "$manifest.orig"
          done
          cargo update --workspace --quiet
      # build.rs puts it in the version resource's source link; a step of its own, so
      # a failing git fails the job.
      - name: Built commit
        run: echo "DEVLANES_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # devlanes-hosts is Unix-only; .cargo/config.toml links the C runtime statically.
      # The MSVC linker writes devlanes.pdb whatever `strip` says, and the executable
      # names it without a directory; line tables add file:line to it.
      #
      # kache doesn't cache executables here, so the shipped devlanes.exe and
      # devlanes.pdb are the pair this job's linker wrote, not one restored on the
      # strength of kache's GUID and age check. Caching would gain little: devlanes.exe
      # misses anyway, as the version and commit change on every build. Set explicitly
      # in case kache's Windows default changes.
      - name: Build
        env:
          DEVLANES_BUILD_ID: v${{ inputs.version }}
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          KACHE_CACHE_EXECUTABLES: 0
        run: cargo build --release --locked --target "$TARGET" -p devlanes
      # .gitattributes checks the schemas out with LF on Windows too, as build.rs writes them.
      - name: Check the committed schemas
        run: git diff --exit-code crates/config/schema.json crates/config/user-schema.json
      - name: Smoke test
        run: |
          "target/$TARGET/release/devlanes.exe" --version | tr -d '\r' | grep -Fx "devlanes $VERSION"
      # build.rs embeds it; Explorer, Task Manager and antivirus heuristics read it.
      - name: Check the version resource
        shell: pwsh
        run: |
          $info = (Get-Item "target/$env:TARGET/release/devlanes.exe").VersionInfo
          if ($info.ProductVersion -cne $env:VERSION -or $info.ProductName -cne 'devlanes-cli' -or
              -not ([string]$info.Comments).Contains("/tree/$env:DEVLANES_BUILD_COMMIT")) {
            throw "unexpected version resource: $($info | Format-List | Out-String)"
          }
      # The Visual C++ Redistributable is not part of Windows, so the executable must
      # not import its DLLs.
      - name: Check the C runtime is linked statically
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = @(& $vswhere -latest -products * -find 'VC\Tools\MSVC\*\bin\Host*\*\dumpbin.exe')[0]
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $imports = & $dumpbin /nologo /dependents "target/$env:TARGET/release/devlanes.exe" | Out-String
          if ($LASTEXITCODE -ne 0 -or $imports -notmatch '(?im)^\s+kernel32\.dll\s*$') { throw "unexpected dumpbin output:`n$imports" }
          if ($imports -match '(?im)^\s+(vcruntime|msvcp)\S*\.dll\s*$') { throw "devlanes.exe imports the Visual C++ runtime:`n$imports" }
          Write-Output $imports
      # Next to the executable in a directory of its own, dumpbin names the PDB that
      # matches its GUID and age; a checked one that doesn't gets a reason in parentheses.
      - name: Check the PDB matches the executable
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'pdb-check'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/$env:TARGET/release/devlanes.exe", "target/$env:TARGET/release/devlanes.pdb" $dir
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = @(& $vswhere -latest -products * -find 'VC\Tools\MSVC\*\bin\Host*\*\dumpbin.exe')[0]
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $pdb = Join-Path $dir 'devlanes.pdb'
          $out = & $dumpbin /nologo /pdbpath:verbose (Join-Path $dir 'devlanes.exe') | Out-String
          $found = @($out -split "`r?`n" | Where-Object { $_.Contains("'$pdb'") -and -not $_.Contains('(') })
          if ($LASTEXITCODE -ne 0 -or $found.Count -ne 1) { throw "devlanes.pdb does not match devlanes.exe:`n$out" }
          Write-Output $found
          Get-Item "target/$env:TARGET/release/devlanes.exe", "target/$env:TARGET/release/devlanes.pdb" | Format-Table Name, Length
      - name: Package
        shell: pwsh
        run: ./packaging/scripts/package.ps1 -Version $env:VERSION -Target $env:TARGET -OutDir dist
      - name: Package the debug files
        run: sh packaging/scripts/package-debug.sh "$VERSION" "$TARGET" dist "target/$TARGET/release/devlanes.pdb"
      - name: kache stats
        if: ${{ !cancelled() }}
        run: |
          kache stats
          # Lets the daemon finish its queued uploads before the runner goes away.
          kache daemon stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
