[workspace]
members = ["bins/devlanes", "bins/devlanes-gui", "crates/*", "e2e"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/devlanes-run/devlanes"
publish = false

# A change to these runs every CI job and test. Packages list the files they read from
# outside their directory in `[package.metadata.ci]`; .github/scripts/affected.js says how.
[workspace.metadata.ci]
inputs = [".github/workflows/ci.yml", ".github/actions/", ".github/scripts/", ".cargo/", ".config/", "rust-toolchain.toml"]

[workspace.dependencies]
async-trait = "0.1"
anyhow = "1"
# HTML templates of crates/pages; it adds the features it uses.
askama = { version = "0.16", default-features = false }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
diesel = { version = "2.3", default-features = false, features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
# `std::fs::canonicalize` on Unix; on Windows it avoids the `\\?\` form Git and
# most tools cannot use.
dunce = "1"
# Compiles the Windows version resources of the two binaries with the SDK's rc.exe.
embed-resource = "3"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4"
# SCSS for the stylesheets crates/pages compiles at build time.
grass = { version = "0.13", default-features = false }
# Agent detection: the CLI's actor and output mode, the agent markers lane units
# do not inherit.
is-ai-agent = "0.7"
# The MCP server of `devlanes mcp` (crates/mcp). Pinned: the protocol revisions it
# negotiates come with the version.
rmcp = { version = "=3.9.0", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON output follows struct field order, and the feature is pinned
# here so per-crate and workspace builds don't disagree through feature unification.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
# Splits the `run_script` names of the Maven and Gradle runners and the JVM
# contributors that inspect them.
shell-words = "1"
# Constant-time comparison of pairing codes and token hashes.
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
# The log output of the two binaries.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
# `std::time::Instant` and `SystemTime` natively (re-exported, so the types are
# std's); the browser's clock in wasm32 builds, where std's clock panics.
web-time = "1"
windows-sys = { version = "0.61", default-features = false }
zstd = { version = "0.14", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"

# Release binaries are shipped (GitHub releases, Homebrew, npm); size and speed matter
# more than build time there.
[profile.release]
lto = "thin"
# 4, not 1: a release always recompiles devlanes-daemon and the devlanes binary (their
# versions change, so kache has no entry), and with 1 unit each compiles on one thread.
# Measured on 0.5.0's code, rebuilding those crates took 4m13s with 1 unit, 1m32s with 4
# and 1m28s with Cargo's default of 16, for a binary 8% (4) or 21% (16) bigger than with 1.
# The macOS runners have 3 cores, so more units than 4 gain little.
codegen-units = 4
# Release CI (.github/workflows/build.yml) adds line tables through CARGO_PROFILE_RELEASE_*
# and ships them as separate debug archives, keeping the binaries stripped; `cargo install`
# and local release builds stay without debug info.
strip = true

# The TUI web demo (crates/tui-web, `packaging/scripts/tui-web.sh`): every visitor
# downloads it, so size wins over build time and speed.
[profile.web]
inherits = "release"
# `z` over `s`: measured on the first build, 1.04 MB gzipped instead of 1.24 MB.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
