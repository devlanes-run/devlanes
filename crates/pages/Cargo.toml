[package]
name = "devlanes-pages"
description = "Error pages the devlanes proxy serves itself, as HTML or Markdown."
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
devlanes-version = { path = "../version" }
askama = { workspace = true, features = ["derive", "std"] }
percent-encoding = "2"

# The stylesheet is compiled and hashed at build time, so none of these ship in the binary.
[build-dependencies]
base64.workspace = true
grass.workspace = true
sha2 = "0.10"

[lints]
workspace = true
