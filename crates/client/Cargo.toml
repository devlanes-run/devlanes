[package]
name = "devlanes-client"
description = "Local daemon client for devlanes CLI, completions, and TUI"
version = "0.11.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
devlanes-version = { path = "../version" }
bytes.workspace = true
devlanes-core = { path = "../core" }
devlanes-ipc = { path = "../ipc" }
devlanes-proto = { path = "../proto" }
devlanes-update = { path = "../update" }
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tracing.workspace = true
# The restart step rows' `Instant`, which std cannot read in the browser.
web-time.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio.workspace = true

# The browser (wasm32) build, where tokio compiles only with these features.
[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(unix)'.dev-dependencies]
# The daemon's lock on Unix, so tests take `daemon.lock` exactly as it does.
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
devlanes-sys-windows = { path = "../sys-windows" }

[lints]
workspace = true
