[package]
name = "devlanes-loopback"
description = "Connects to ports on this machine's loopback addresses"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["net", "time"] }

# Skips the SYN retries that make a refused loopback connect take 2 s.
[target.'cfg(windows)'.dependencies]
devlanes-sys-windows = { path = "../sys-windows" }

[dev-dependencies]
tokio.workspace = true
