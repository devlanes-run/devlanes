[package]
name = "devlanes-console-windows"
description = "Console prompts and attach input and output for the devlanes CLI on Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The crate is empty on other platforms, so its dependencies are Windows-only too.
[target.'cfg(windows)'.dependencies]
# Same version as the binary; only for the window size.
crossterm = "0.29"
devlanes-sys-windows = { path = "../sys-windows" }
tokio.workspace = true
