[package]
name = "devlanes-transport"
description = "Transport-independent remote protocol between a devlanes client daemon and a box"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `conformance`, the checks every connection type must pass; only
# dev-dependencies enable it.
test-support = []

[dependencies]
devlanes-loopback = { path = "../loopback" }
async-trait.workspace = true
bytes.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true
yamux = "0.14"
zstd.workspace = true

[dev-dependencies]
# The integration tests run the conformance checks on the memory transport.
devlanes-transport = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
