[package]
name = "devlanes-update"
description = "How devlanes was installed, its stable path, release checks and installing updates"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
devlanes-version = { path = "../version" }
# The user's home, for cargo's and uv's default directories.
devlanes-core = { path = "../core" }
dunce.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

# Release checks and installs run `curl`, `tar` and package managers from the
# caller's runtime. The browser (wasm32) build leaves them out: tokio has no
# processes or files there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio.workspace = true

# Which processes still run, for the executables they keep, and renames that
# ride out another process holding the file.
[target.'cfg(windows)'.dependencies]
devlanes-sys = { path = "../sys" }
devlanes-sys-windows = { path = "../sys-windows" }

[dev-dependencies]
tempfile.workspace = true

# `fake-tool` stands in for a release's `devlanes.exe`, where `#!/bin/sh` fakes cannot run.
[target.'cfg(windows)'.dev-dependencies]
devlanes-testing = { path = "../testing" }

[lints]
workspace = true
