<!doctype html>
<html lang="en" data-theme="__THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · devlanes card preview</title>
<style>
:root { --bg: #f4f3ef; --ink: #24231f; --muted: #63615a; --line: #d1cfc7; --panel: #fff; color-scheme: light; }
:root[data-theme='dark'] { --bg: #141311; --ink: #f2f0ea; --muted: #b0ada3; --line: #4c4941; --panel: #1c1b18; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
header h1 { margin: 0 12px 0 0; font-size: 14px; }
header a { color: inherit; }
button { font: 12px ui-monospace, monospace; padding: 4px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--ink); cursor: pointer; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; padding: 16px; align-items: start; }
.chat { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.chat p { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
#box { max-width: 100%; }
#box.fullscreen { position: fixed; inset: 0; z-index: 5; width: 100% !important; background: var(--bg); }
#box.fullscreen iframe { height: 100% !important; }
iframe { display: block; width: 100%; height: 200px; border: 0; }
aside { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 32px); }
aside h2 { display: flex; justify-content: space-between; align-items: center; margin: 0; font-size: 12px; }
#log { flex: 1; margin: 0; padding: 0; overflow: auto; list-style: none; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font: 11.5px ui-monospace, monospace; }
#log li { padding: 2px 8px; border-bottom: 1px solid var(--line); }
#log li.in summary { color: #b3541e; }
:root[data-theme='dark'] #log li.in summary { color: #e8a13c; }
#log pre { margin: 4px 0; white-space: pre-wrap; word-break: break-all; color: var(--muted); }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { position: static; max-height: 420px; } }
</style>
</head>
<body>
<header>
<h1>__TITLE__</h1>
<a href="index.html">all previews</a>
<button type="button" data-action="theme">toggle theme</button>
<button type="button" data-action="result">send result now</button>
<button type="button" data-action="cancel">cancel the call</button>
<button type="button" data-action="teardown">tear down</button>
</header>
<main>
<section class="chat">
<p>__ARGS__</p>
<div id="box"><iframe id="card" title="devlanes card" sandbox="allow-scripts" allow="clipboard-write"></iframe></div>
</section>
<aside>
<h2>messages <button type="button" data-action="clear">clear</button></h2>
<ol id="log"></ol>
</aside>
</main>
<script>window.PREVIEW = __PREVIEW__;</script>
<script>__HOST__</script>
</body>
</html>
