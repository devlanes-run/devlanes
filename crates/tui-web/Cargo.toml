[package]
name = "devlanes-tui-web"
description = "The devlanes TUI in the browser, on a fake daemon, for the devlanes.run demo"
version = "0.3.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib is the module wasm-bindgen turns into the website's bundle; rlib keeps
# the session logic testable natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The daemon stop and restart steps the TUI draws.
devlanes-client = { path = "../client" }
# The unit colors the daemon would give the scene's services.
devlanes-core = { path = "../core" }
# The options page's edits, applied to the scene's config.yaml as devlanes does.
devlanes-config = { path = "../config" }
devlanes-proto = { path = "../proto" }
devlanes-tui = { path = "../tui" }
devlanes-version = { path = "../version" }
serde_json.workspace = true
web-time.workspace = true
# Only buffer and color types; devlanes-tui picks the backend features per target.
ratatui = { version = "0.30", default-features = false }

# Natively the crate is only the session and key mapping, which its tests drive;
# the DOM side exists in the browser build alone.
[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1"
ratzilla = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "console",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "HtmlHeadElement",
  "MouseEvent",
  "PointerEvent",
  "WheelEvent",
  "Window",
] }

[lints]
workspace = true
