[package]
name = "devlanes-transport-iroh"
description = "Peer-to-peer transport for devlanes remote connect over iroh, direct paths only"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
devlanes-transport = { path = "../transport" }
futures-util.workspace = true
# Default features: ring for TLS, the port mapper, metrics and the faster macOS
# datapath.
iroh.workspace = true
# The crypto provider handed to iroh explicitly, as crates/pki and crates/proxy do,
# so nothing depends on a process-wide default.
rustls.workspace = true
tokio.workspace = true
tracing.workspace = true

# The key file's access check, as the CA key's in crates/pki.
[target.'cfg(windows)'.dependencies]
devlanes-sys-windows = { path = "../sys-windows" }

[dev-dependencies]
# The connection and peer checks every transport passes.
devlanes-transport = { path = "../transport", features = ["test-support"] }
# A relay on loopback over plain HTTP, so no test reaches a public relay.
iroh-relay = { workspace = true, features = ["server", "tls-ring"] }
tempfile.workspace = true
