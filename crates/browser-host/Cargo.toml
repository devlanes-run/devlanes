[package]
name = "devlanes-browser-host"
description = "Native messaging host that relays the devlanes browser extension's requests to the daemon"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
devlanes-client = { path = "../client" }
devlanes-proto = { path = "../proto" }
devlanes-version = { path = "../version" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
# Paused time for the view throttle and the 30 s switch wait.
tokio = { workspace = true, features = ["test-util"] }
